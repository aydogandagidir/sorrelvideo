components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Session cookie issued by login/signup (7-day TTL).
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque session token sent as `Authorization: Bearer <sid>` — the
        cookie's equivalent for non-browser clients.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
        firstName:
          type: ["string", "null"]
          maxLength: 100
        lastName:
          type: ["string", "null"]
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    GenericSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 256
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    HealthUnhealthy:
      type: object
      description: >-
        503 body from /healthz when a dependency probe fails. `status` is always
        "error"; `checks` maps each probed dependency to "ok"/"error" (redis is
        present only when REDIS_URL is configured).
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - error
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - error

    Template:
      type: object
      required: [id, name, category, module, thumbnailUrl, duration, isPremium]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string
        supportsTransitions:
          type: boolean
          description: >-
            True when the template's composition declares the scene structure
            required by shader transitions (>=2 .scene elements + a
            data-scene-boundary). Derived server-side from the shipped
            composition (services/transitionCapableTemplates.ts) — the editor
            disables the transitions picker when false.
        variables:
          type: array
          description: >-
            Typed editable parameters the composition declares via the engine's
            native data-composition-variables. Present only for parametric
            templates (e.g. data-chart); the Studio form renders one control per
            entry's type. Derived from the manifest at read time (not persisted).
          items:
            $ref: "#/components/schemas/CompositionVariable"
        createdAt:
          type: string

    CompositionVariable:
      type: object
      description: >-
        A typed editable parameter declared by a composition. Mirrors
        @hyperframes/core's CompositionVariable union as one object plus a `type`
        discriminator; the option/min/max fields apply per type.
      required: [id, type, label, default]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [string, number, color, boolean, enum]
        label:
          type: string
        description:
          type: string
        default:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        placeholder:
          type: string
        maxLength:
          type: integer
        min:
          type: number
        max:
          type: number
        step:
          type: number
        unit:
          type: string
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    TemplateInput:
      type: object
      required: [name, category, module, thumbnailUrl, duration]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string

    Project:
      type: object
      required: [id, name, status, module, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, rendering, ready, failed]
        module:
          type: string
        templateId:
          type: ["integer", "null"]
        brandKitId:
          description: The brand kit this project renders with. Null → the user's default.
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        renderError:
          type: ["string", "null"]
        compositionVars:
          description: Studio placeholder values keyed by `user.*` / `brand.*`. Optional.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        renderSettings:
          description: Per-project render configuration. Null → server defaults.
          oneOf:
            - $ref: "#/components/schemas/RenderSettings"
            - type: "null"
        renderProgress:
          description: >-
            Live render progress (0–100) of the latest render job. Populated only
            while `status` is `rendering`; null otherwise. Additive/optional.
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        renderCost:
          description: >-
            Estimated render cost in cents from the latest render job. Populated
            only while `status` is `rendering` (when a metered backend reports it);
            null otherwise. Additive/optional.
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name, module]
      properties:
        name:
          type: string
        description:
          type: string
        module:
          type: string
        templateId:
          type: integer
        brandKitId:
          type: integer
          description: Brand kit (DNA) to render with. Null/omitted → the user's default.
        compositionVars:
          type: object
          additionalProperties:
            type: string

    ProjectUpdate:
      # User-editable project fields only. Server-managed lifecycle/denormalized
      # render state (status, videoUrl, thumbnailUrl, renderError, duration) is
      # deliberately NOT here: the render state machine — atomic claim, worker,
      # cancel, and recoverStuckRenders — is the only writer of those columns. A
      # generic PATCH that set status:'rendering' would strand the next render
      # (409 "already in progress"), and flipping failed→ready would advertise a
      # video that does not exist. Render config lives behind the dedicated,
      # Pro-gated PATCH /projects/{id}/render-settings.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        compositionVars:
          type: object
          additionalProperties:
            type: string

    RenderTransition:
      type: object
      required: [time, shader, duration, ease]
      properties:
        time:
          type: number
        shader:
          type: string
        duration:
          type: number
        ease:
          type: string

    RenderSettings:
      type: object
      required: [fps, quality, format, resolution, transparent, watermark]
      properties:
        fps:
          type: integer
          enum: [24, 30, 60]
        quality:
          type: string
          enum: [draft, standard, high]
        format:
          type: string
          enum: [mp4, webm, mov, png-sequence, gif]
        resolution:
          type: string
          enum: [landscape, portrait, square, landscape-4k, portrait-4k, square-4k]
        transparent:
          type: boolean
        watermark:
          type: boolean
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/RenderTransition"
        backgroundAudio:
          type: [object, "null"]
          description: Optional background audio track (Pro). null → silent output.
          required: [objectPath, volume]
          properties:
            objectPath:
              type: string
              description: "/objects/... path of the user's uploaded audio object."
            volume:
              type: integer
              minimum: 0
              maximum: 100
        captions:
          type: [object, "null"]
          description: Optional word-timed captions (Pro). null → none.
          required: [words]
          properties:
            words:
              type: array
              items:
                type: object
                required: [text, start, end]
                properties:
                  text:
                    type: string
                  start:
                    type: number
                  end:
                    type: number
            style:
              type: string
              enum: [classic, pill-karaoke, neon-accent, kinetic-slam]
              description: Caption visual preset. Absent === classic.
        voiceover:
          type: [object, "null"]
          description: >
            Talking-host narration (server-managed — set by POST /avatar/video,
            not client-writable; deliberately absent from RenderSettingsInput).
          required: [objectPath, startAt]
          properties:
            objectPath:
              type: ["string", "null"]
              description: >
                /objects/... path of the persisted TTS audio, or null when only
                the local render-dir copy exists.
            startAt:
              type: number
              description: Seconds into the composition where speech starts.
            volume:
              type: integer
              minimum: 0
              maximum: 100

    RenderSettingsInput:
      type: object
      description: Partial render settings; omitted fields keep their current value.
      properties:
        fps:
          type: integer
          enum: [24, 30, 60]
        quality:
          type: string
          enum: [draft, standard, high]
        format:
          type: string
          enum: [mp4, webm, mov, png-sequence, gif]
        resolution:
          type: string
          enum: [landscape, portrait, square, landscape-4k, portrait-4k, square-4k]
        transparent:
          type: boolean
        watermark:
          type: boolean
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/RenderTransition"
        backgroundAudio:
          type: [object, "null"]
          description: Optional background audio track (Pro). null → silent output.
          required: [objectPath, volume]
          properties:
            objectPath:
              type: string
              description: "/objects/... path of the user's uploaded audio object."
            volume:
              type: integer
