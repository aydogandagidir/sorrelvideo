            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # Public/iframe asset-serving routes are intentionally omitted from the typed
  # spec — the SPA loads them as plain <img src>/iframe URLs, never through the
  # generated React Query hooks (declaring them would emit unused Blob hooks),
  # exactly like the /composition preview + project video/thumbnail streams.
  # Behaviour, for reference (see routes/templates.ts + routes/projects.ts):
  #   GET /templates/thumbnails/{slug}  -> image/png; PUBLIC (no auth); slug
  #       allow-listed against the vendored manifest; 404 on unknown/missing.
  #   GET /templates/{id}/assets/{name} -> image/* or audio/*; AUTH; name
  #       allow-listed against the manifest (no traversal); 401/404.
  #   GET /projects/{id}/assets/{name}  -> image/* or audio/* (same MIME set);
  #       AUTH + owner-scoped; name allow-listed; 401/403/404.

  /billing/prices:
    get:
      operationId: listBillingPrices
      tags: [billing]
      summary: List active Stripe prices for Pro plan (public, no auth required)
      security: []
      responses:
        "200":
          description: List of prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/finalize:
    put:
      tags: [Storage]
      operationId: finalizeUpload
      summary: Stamp the owner ACL on a freshly uploaded object
      description: |
        Second half of the two-phase upload. After PUTting the file bytes to the
        presigned URL from `request-url`, call this with the returned
        `objectPath` to record the per-object owner ACL. The owner is the
        authenticated caller (clients cannot choose it) and visibility is forced
        to private. Until an upload is finalized the object has no ACL and the
        object-serving route refuses to return it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Owner ACL recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeUploadResult"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found (never uploaded, or forged path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to finalize upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      security: []
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /stats/overview:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform usage statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
