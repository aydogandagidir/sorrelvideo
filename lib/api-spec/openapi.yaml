openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sorrel - Modular Video Production Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: templates
    description: Video template operations
  - name: projects
    description: Video project operations
  - name: brand
    description: Brand kit operations
  - name: modules
    description: Platform modules
  - name: stats
    description: Platform statistics
  - name: billing
    description: Billing and subscription management

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect on success or failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List video templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List video projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/render:
    post:
      operationId: startProjectRender
      tags: [projects]
      summary: Start a render job for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Render started — project status set to rendering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Render already in progress

  /projects/{id}/video:
    get:
      operationId: getProjectVideo
      tags: [projects]
      summary: Stream the rendered video file for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: MP4 video stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Video not available yet

  /brand:
    get:
      operationId: getBrandKit
      tags: [brand]
      summary: Get the current brand kit
      responses:
        "200":
          description: Brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
    put:
      operationId: updateBrandKit
      tags: [brand]
      summary: Update the brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "200":
          description: Updated brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List available platform modules
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /billing/me:
    get:
      operationId: getBillingInfo
      tags: [billing]
      summary: Get current user billing info and plan
      responses:
        "200":
          description: Billing info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInfo"
        "401":
          description: Unauthorized

  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout session for upgrading to Pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Create a Stripe Customer Portal session for managing subscriptions
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"
        "400":
          description: No billing account found
        "401":
          description: Unauthorized

  /billing/prices:
    get:
      operationId: listBillingPrices
      tags: [billing]
      summary: List active Stripe prices for Pro plan (public, no auth required)
      security: []
      responses:
        "200":
          description: List of prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"


  /stats/overview:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform usage statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Template:
      type: object
      required: [id, name, category, module, thumbnailUrl, duration, isPremium]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    TemplateInput:
      type: object
      required: [name, category, module, thumbnailUrl, duration]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string

    Project:
      type: object
      required: [id, name, status, module, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, rendering, ready, failed]
        module:
          type: string
        templateId:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        renderError:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name, module]
      properties:
        name:
          type: string
        description:
          type: string
        module:
          type: string
        templateId:
          type: integer

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, rendering, ready, failed]
        thumbnailUrl:
          type: string
        videoUrl:
          type: string

    BrandKit:
      type: object
      required: [id, primaryColor, secondaryColor, fontFamily, updatedAt]
      properties:
        id:
          type: integer
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: ["string", "null"]
        fontFamily:
          type: string
        companyName:
          type: ["string", "null"]
        updatedAt:
          type: string

    BrandKitInput:
      type: object
      properties:
        logoUrl:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        companyName:
          type: string

    Module:
      type: object
      required: [id, name, slug, description, icon, status]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        status:
          type: string
          enum: [active, coming_soon, beta]
        features:
          type: array
          items:
            type: string

    BillingInfo:
      type: object
      required: [plan, renderCount]
      properties:
        plan:
          type: string
          enum: [free, pro]
        renderCount:
          type: integer
        renderLimit:
          type: ["integer", "null"]
        renderResetAt:
          type: ["string", "null"]
        stripeCustomerId:
          type: ["string", "null"]

    CheckoutRequest:
      type: object
      required: [priceId]
      properties:
        priceId:
          type: string

    CheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: ["string", "null"]

    PortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: ["string", "null"]

    BillingPrice:
      type: object
      required: [id, currency]
      properties:
        id:
          type: string
        unitAmount:
          type: ["integer", "null"]
        currency:
          type: string
        interval:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]

    PricesResponse:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/BillingPrice"

    PlatformStats:
      type: object
      required: [totalProjects, totalTemplates, videosRendered, activeModules]
      properties:
        totalProjects:
          type: integer
        totalTemplates:
          type: integer
        videosRendered:
          type: integer
        activeModules:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
