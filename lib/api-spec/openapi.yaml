    CropRegion:
      type: object
      description: >-
        A region to FEATURE, as 0–1 fractions of the captured screenshot
        (x/y = top-left, w/h = size). Clamped server-side; w/h are floored so a
        tiny selection can't zoom to infinity.
      required: [x, y, w, h]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }

    WebsiteToVideoPreviewRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The public website URL to capture (http/https only).
          maxLength: 2048

    WebsiteToVideoPreviewResponse:
      type: object
      required: [previewId, image, width, height]
      properties:
        previewId:
          type: string
          description: Pass back to POST /website-to-video with a `crop` to render.
        image:
          type: string
          description: The captured screenshot as a data URI (for the crop UI).
        width:
          type: integer
          description: Screenshot width in px (the crop fractions are relative to this).
        height:
          type: integer
          description: Screenshot height in px.

    WebsiteToVideoRequest:
      type: object
      description: >-
        Provide either `url` (capture fresh — the one-shot flow) or `previewId`
        (from POST /website-to-video/preview — the crop flow). Exactly one.
      properties:
        url:
          type: string
          description: The public website URL to capture (http/https only).
          maxLength: 2048
        previewId:
          type: string
          description: >-
            Id from a prior /website-to-video/preview call. When set, that
            already-captured screenshot is reused and `crop` features a region.
          maxLength: 128
        crop:
          $ref: "#/components/schemas/CropRegion"
        selector:
          type: string
          description: >-
            A CSS selector ("by element" mode) — the capture resolves the matching
            element's box and features it. Requires `url`.
          maxLength: 400
        section:
          type: string
          enum: [hero]
          description: A preset section — "hero" features the first screen. Requires `url`.
        brandKitId:
          type: integer
          description: >-
            Brand kit to render the showcase with. Omit to use your configured
            default kit, or — if you have none — to auto-create one detected from
            the site.
        autoBrand:
          type: boolean
          description: >-
            Force detecting a fresh brand kit from this site (and saving it),
            ignoring any existing default. Overridden by an explicit brandKitId.
        duration:
          type: integer
          description: >-
            Video length in seconds. Clamped server-side to 3–60. OMIT for an
            automatic length scaled to the captured page height (a calm, complete
            scroll); a tall page therefore gets a longer video instead of racing.
            The intro/outro are fixed-length; the page scroll fills the rest.
          minimum: 3
          maximum: 60

