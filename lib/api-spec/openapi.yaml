      operationId: lintComposition
      tags: [compositions]
      summary: Lint composition HTML and report findings (non-blocking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LintRequest"
      responses:
        "200":
          description: Lint findings (empty array means nothing to report).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintResponse"
        "400":
          description: Request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /website-to-video/preview:
