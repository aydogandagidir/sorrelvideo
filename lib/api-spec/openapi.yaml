openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sorrel - Modular Video Production Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: templates
    description: Video template operations
  - name: projects
    description: Video project operations
  - name: brand
    description: Brand kit operations
  - name: modules
    description: Platform modules
  - name: stats
    description: Platform statistics
  - name: analytics
    description: Render analytics and usage metrics
  - name: billing
    description: Billing and subscription management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: ai
    description: LLM-backed content suggestion.
  - name: avatar
    description: Script-to-talking-host video and live avatar sessions.
  - name: compositions
    description: Live composition preview and linting.

# Default security: every operation requires a session (cookie `sid` or an
# `Authorization: Bearer <sid>` token) unless it overrides this with
# `security: []` — the genuinely-public auth / health / pricing / public-object
# endpoints do so below.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      security: []
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signupWithPassword
      security: []
      summary: Create a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Invalid input (e.g. password too short).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account already exists with this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      security: []
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated successfully; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Email or password did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      security: []
      summary: Clear the current session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Session cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      security: []
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Generic success — sent only if the email is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      summary: Consume a password-reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated; reset token consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
        "400":
          description: Token is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/verify-email:
    get:
      tags: [Auth]
      operationId: consumeEmailVerification
      security: []
      summary: Verify an email address via a token from the verification email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to /email-verified with a status query string.
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      security: []
      summary: Resend the email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Always 200 — generic response to avoid email enumeration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
  # OAuth GET endpoints (/auth/oauth/{provider}, /auth/oauth/{provider}/callback)
  # are intentionally omitted from the spec — they are browser-only redirects
  # invoked via window.location.href, never typed React Query hooks, so no
  # codegen output is required. See artifacts/api-server/src/routes/auth.ts
  # and CLAUDE.md "Auth model" for behavior.
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      security: []
      summary: Redirect helper that sends the browser to the frontend login page
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend /login page.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      security: []
      summary: Clear the session and redirect to the home page
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the home page after clearing the session.
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Unhealthy — one or more dependency probes (Postgres, and Redis when
            REDIS_URL is set) failed. The body names the failing dependency so the
            platform healthcheck/dashboards show why the instance was pulled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnhealthy"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List video templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found

  /templates/{id}/use:
    post:
      operationId: useTemplate
      tags: [templates]
      summary: Create a project from a template at its native aspect ratio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Premium template requires a Pro plan
        "404":
          description: Template not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List video projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/render:
    post:
      operationId: startProjectRender
      tags: [projects]
      summary: Start a render job for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Render started — project status set to rendering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Render already in progress
        "503":
          description: Render could not be started (queue/ledger unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /projects/{id}/render/cancel:
    post:
      operationId: cancelProjectRender
      tags: [projects]
      summary: Request cancellation of a project's in-flight render
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancellation requested — the worker finalizes the project to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: No render in progress

  /projects/{id}/video:
    get:
      operationId: getProjectVideo
      tags: [projects]
      summary: Stream the rendered video file for a project
      description: >-
        Streams the rendered video with the Content-Type matching the
        project's render format (mp4 → video/mp4, webm → video/webm,
        mov → video/quicktime). Projects rendered as a png-sequence have no
        single streamable file and return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rendered video stream (format-dependent Content-Type)
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Video not available yet
        "409":
          description: Project rendered a PNG sequence; not streamable as a file

  /projects/{id}/composition:
    get:
      operationId: getProjectComposition
      tags: [projects]
      summary: Serve a project's fully-substituted composition HTML for preview
      description: >-
        Returns the composition HTML for a project with the brand kit and
        compositionVars already merged and substituted — the same output the
        render pipeline feeds Hyperframes — so the frontend player can preview
        it without a render. The optional `vars` query param is a base64-encoded
        JSON object whose keys override the project's saved compositionVars
        (so the Studio editor can preview unsaved edits); when absent the saved
        compositionVars are used. Served with `Cache-Control: no-store` so the
        preview always reflects live edits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        # NOTE: the route also reads an optional `?vars=<base64-json>` override
        # for live Studio preview. It is intentionally NOT declared as a typed
        # query param: the player loads this URL via <hyperframes-player src=...>,
        # never a typed hook, and declaring both a path param and a query param
        # makes orval emit a colliding `GetProjectCompositionParams` (path zod vs
        # query type). The Express route validates `vars` manually.
      responses:
        "200":
          description: The substituted composition HTML
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid project id or malformed vars
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Project not found

  /projects/{id}/thumbnail:
    get:
      operationId: getProjectThumbnail
      tags: [projects]
      summary: Stream the rendered poster-frame thumbnail (PNG) for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PNG thumbnail image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Thumbnail not available

  /projects/{id}/render-settings:
    patch:
      operationId: updateProjectRenderSettings
      tags: [projects]
      summary: Update a project's render settings (Pro-only capabilities gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderSettingsInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — upgrade_required for Pro-only settings
        "404":
          description: Not found

  /brand:
    get:
      operationId: getBrandKit
      tags: [brand]
      summary: Get the current brand kit
      responses:
        "200":
          description: Brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
    put:
      operationId: updateBrandKit
      tags: [brand]
      summary: Update the default brand kit (back-compat singleton accessor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "200":
          description: Updated brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"

  /brand-kits:
    get:
      operationId: listBrandKits
      tags: [brand]
      summary: List the user's brand kits (default first)
      responses:
        "200":
          description: Brand kits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandKit"
        "401":
          description: Unauthorized
    post:
      operationId: createBrandKit
      tags: [brand]
      summary: Create a brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "201":
          description: The created brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "400":
          description: Invalid brand kit fields
        "401":
          description: Unauthorized

  /brand-kits/extract:
    post:
      operationId: extractBrand
      tags: [brand]
      summary: Detect a brand kit from a website URL (does not save it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractBrandRequest"
      responses:
        "200":
          description: The detected brand (review, then POST /brand-kits to save).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedBrand"
        "400":
          description: The URL is invalid or not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "429":
          description: Too many capture requests; back off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The site could not be loaded or captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /brand-kits/{id}:
    get:
      operationId: getBrandKitById
      tags: [brand]
      summary: Get a brand kit by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateBrandKitById
      tags: [brand]
      summary: Update a brand kit by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "200":
          description: Updated brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        "400":
          description: Invalid brand kit fields
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteBrandKit
      tags: [brand]
      summary: Delete a brand kit by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /brand-kits/{id}/video-ideas:
    post:
      operationId: generateVideoIdeas
      tags: [brand]
      summary: Generate ready-to-render video ideas from a brand kit's DNA
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated video ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoIdeasResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — upgrade_required when the AI quota is exhausted
        "404":
          description: Not found
        "502":
          description: The AI provider could not generate ideas
        "503":
          description: AI is not configured

  /modules:
    get:
      operationId: listModules
      security: []
      tags: [modules]
      summary: List available platform modules
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /billing/me:
    get:
      operationId: getBillingInfo
      tags: [billing]
      summary: Get current user billing info and plan
      responses:
        "200":
          description: Billing info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInfo"
        "401":
          description: Unauthorized

  /ai/suggest:
    post:
      operationId: aiSuggest
      tags: [ai]
      summary: Generate Studio copy (headline, bodyText, ctaText) for a brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestRequest"
      responses:
        "200":
          description: Suggestion produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestResult"
        "400":
          description: Prompt failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: AI quota exhausted — upgrade required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests; back off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Provider call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /captions/generate:
    post:
      operationId: generateCaptions
      tags: [ai]
      summary: Generate word-timed captions from an uploaded audio object (Pro)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCaptionsRequest"
      responses:
        "200":
          description: Captions generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCaptionsResult"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Pro plan required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Audio exceeds the transcription size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Unexpected error generating captions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Transcription failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Transcription is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /avatar/session-token:
    post:
      operationId: createAvatarSessionToken
      tags: [avatar]
      summary: Mint a short-lived LiveAvatar session token (Pro)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarSessionTokenRequest"
      responses:
        "200":
          description: Session token minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarSessionTokenResult"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Pro plan required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: LiveAvatar upstream failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Live avatar is not configured.
          content:
