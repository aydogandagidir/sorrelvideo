openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sorrel - Modular Video Production Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: templates
    description: Video template operations
  - name: projects
    description: Video project operations
  - name: brand
    description: Brand kit operations
  - name: modules
    description: Platform modules
  - name: stats
    description: Platform statistics
  - name: billing
    description: Billing and subscription management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: ai
    description: LLM-backed content suggestion.

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signupWithPassword
      summary: Create a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Invalid input (e.g. password too short).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account already exists with this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated successfully; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Email or password did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: Clear the current session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Session cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Generic success — sent only if the email is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Consume a password-reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated; reset token consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
        "400":
          description: Token is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/verify-email:
    get:
      tags: [Auth]
      operationId: consumeEmailVerification
      summary: Verify an email address via a token from the verification email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to /email-verified with a status query string.
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      summary: Resend the email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Always 200 — generic response to avoid email enumeration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
  # OAuth GET endpoints (/auth/oauth/{provider}, /auth/oauth/{provider}/callback)
  # are intentionally omitted from the spec — they are browser-only redirects
  # invoked via window.location.href, never typed React Query hooks, so no
  # codegen output is required. See artifacts/api-server/src/routes/auth.ts
  # and CLAUDE.md "Auth model" for behavior.
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Redirect helper that sends the browser to the frontend login page
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend /login page.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and redirect to the home page
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the home page after clearing the session.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List video templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found

  /templates/{id}/use:
    post:
      operationId: useTemplate
      tags: [templates]
      summary: Create a project from a template at its native aspect ratio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Premium template requires a Pro plan
        "404":
          description: Template not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List video projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/render:
    post:
      operationId: startProjectRender
      tags: [projects]
      summary: Start a render job for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Render started — project status set to rendering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: Render already in progress

  /projects/{id}/render/cancel:
    post:
      operationId: cancelProjectRender
      tags: [projects]
      summary: Request cancellation of a project's in-flight render
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancellation requested — the worker finalizes the project to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: No render in progress

  /projects/{id}/video:
    get:
      operationId: getProjectVideo
      tags: [projects]
      summary: Stream the rendered video file for a project
      description: >-
        Streams the rendered video with the Content-Type matching the
        project's render format (mp4 → video/mp4, webm → video/webm,
        mov → video/quicktime). Projects rendered as a png-sequence have no
        single streamable file and return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rendered video stream (format-dependent Content-Type)
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Video not available yet
        "409":
          description: Project rendered a PNG sequence; not streamable as a file

  /projects/{id}/composition:
    get:
      operationId: getProjectComposition
      tags: [projects]
      summary: Serve a project's fully-substituted composition HTML for preview
      description: >-
        Returns the composition HTML for a project with the brand kit and
        compositionVars already merged and substituted — the same output the
        render pipeline feeds Hyperframes — so the frontend player can preview
        it without a render. The optional `vars` query param is a base64-encoded
        JSON object whose keys override the project's saved compositionVars
        (so the Studio editor can preview unsaved edits); when absent the saved
        compositionVars are used. Served with `Cache-Control: no-store` so the
        preview always reflects live edits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        # NOTE: the route also reads an optional `?vars=<base64-json>` override
        # for live Studio preview. It is intentionally NOT declared as a typed
        # query param: the player loads this URL via <hyperframes-player src=...>,
        # never a typed hook, and declaring both a path param and a query param
        # makes orval emit a colliding `GetProjectCompositionParams` (path zod vs
        # query type). The Express route validates `vars` manually.
      responses:
        "200":
          description: The substituted composition HTML
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid project id or malformed vars
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Project not found

  /projects/{id}/thumbnail:
    get:
      operationId: getProjectThumbnail
      tags: [projects]
      summary: Stream the rendered poster-frame thumbnail (PNG) for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PNG thumbnail image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Thumbnail not available

  /projects/{id}/render-settings:
    patch:
      operationId: updateProjectRenderSettings
      tags: [projects]
      summary: Update a project's render settings (Pro-only capabilities gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderSettingsInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — upgrade_required for Pro-only settings
        "404":
          description: Not found

  /brand:
    get:
      operationId: getBrandKit
      tags: [brand]
      summary: Get the current brand kit
      responses:
        "200":
          description: Brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
    put:
      operationId: updateBrandKit
      tags: [brand]
      summary: Update the brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitInput"
      responses:
        "200":
          description: Updated brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List available platform modules
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /billing/me:
    get:
      operationId: getBillingInfo
      tags: [billing]
      summary: Get current user billing info and plan
      responses:
        "200":
          description: Billing info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInfo"
        "401":
          description: Unauthorized

  /ai/suggest:
    post:
      operationId: aiSuggest
      tags: [ai]
      summary: Generate Studio copy (headline, bodyText, ctaText) for a brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestRequest"
      responses:
        "200":
          description: Suggestion produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestResult"
        "400":
          description: Prompt failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: AI quota exhausted — upgrade required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests; back off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Provider call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout session for upgrading to Pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "409":
          description: Already subscribed — an active Pro subscription exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Create a Stripe Customer Portal session for managing subscriptions
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"
        "400":
          description: No billing account found
        "401":
          description: Unauthorized

  /billing/prices:
    get:
      operationId: listBillingPrices
      tags: [billing]
      summary: List active Stripe prices for Pro plan (public, no auth required)
      security: []
      responses:
        "200":
          description: List of prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/finalize:
    put:
      tags: [Storage]
      operationId: finalizeUpload
      summary: Stamp the owner ACL on a freshly uploaded object
      description: |
        Second half of the two-phase upload. After PUTting the file bytes to the
        presigned URL from `request-url`, call this with the returned
        `objectPath` to record the per-object owner ACL. The owner is the
        authenticated caller (clients cannot choose it) and visibility is forced
        to private. Until an upload is finalized the object has no ACL and the
        object-serving route refuses to return it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Owner ACL recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeUploadResult"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found (never uploaded, or forged path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to finalize upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /stats/overview:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform usage statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /compositions/lint:
    post:
      operationId: lintComposition
      tags: [compositions]
      summary: Lint composition HTML and report findings (non-blocking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LintRequest"
      responses:
        "200":
          description: Lint findings (empty array means nothing to report).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintResponse"
        "400":
          description: Request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /website-to-video/preview:
    post:
      operationId: websiteToVideoPreview
      tags: [projects]
      summary: Capture a website screenshot for the crop UI (step 1 of the crop flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteToVideoPreviewRequest"
      responses:
        "201":
          description: The captured screenshot + a previewId to render with a crop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteToVideoPreviewResponse"
        "400":
          description: The URL is invalid or not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many capture requests; back off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The site couldn't be loaded or captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /website-to-video:
    post:
      operationId: websiteToVideo
      tags: [projects]
      summary: Capture a website and create a branded showcase video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteToVideoRequest"
      responses:
        "201":
          description: The created project (render via POST /projects/{id}/render).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The URL is invalid or not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many capture requests; back off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The site could not be loaded or captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
        firstName:
          type: ["string", "null"]
          maxLength: 100
        lastName:
          type: ["string", "null"]
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    GenericSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 256
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Template:
      type: object
      required: [id, name, category, module, thumbnailUrl, duration, isPremium]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    TemplateInput:
      type: object
      required: [name, category, module, thumbnailUrl, duration]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        module:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
        isPremium:
          type: boolean
        tags:
          type: array
          items:
            type: string

    Project:
      type: object
      required: [id, name, status, module, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, rendering, ready, failed]
        module:
          type: string
        templateId:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        renderError:
          type: ["string", "null"]
        compositionVars:
          description: Studio placeholder values keyed by `user.*` / `brand.*`. Optional.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        renderSettings:
          description: Per-project render configuration. Null → server defaults.
          oneOf:
            - $ref: "#/components/schemas/RenderSettings"
            - type: "null"
        renderProgress:
          description: >-
            Live render progress (0–100) of the latest render job. Populated only
            while `status` is `rendering`; null otherwise. Additive/optional.
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        renderCost:
          description: >-
            Estimated render cost in cents from the latest render job. Populated
            only while `status` is `rendering` (when a metered backend reports it);
            null otherwise. Additive/optional.
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name, module]
      properties:
        name:
          type: string
        description:
          type: string
        module:
          type: string
        templateId:
          type: integer
        compositionVars:
          type: object
          additionalProperties:
            type: string

    ProjectUpdate:
      # User-editable project fields only. Server-managed lifecycle/denormalized
      # render state (status, videoUrl, thumbnailUrl, renderError, duration) is
      # deliberately NOT here: the render state machine — atomic claim, worker,
      # cancel, and recoverStuckRenders — is the only writer of those columns. A
      # generic PATCH that set status:'rendering' would strand the next render
      # (409 "already in progress"), and flipping failed→ready would advertise a
      # video that does not exist. Render config lives behind the dedicated,
      # Pro-gated PATCH /projects/{id}/render-settings.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        compositionVars:
          type: object
          additionalProperties:
            type: string

    RenderTransition:
      type: object
      required: [time, shader, duration, ease]
      properties:
        time:
          type: number
        shader:
          type: string
        duration:
          type: number
        ease:
          type: string

    RenderSettings:
      type: object
      required: [fps, quality, format, resolution, transparent, watermark]
      properties:
        fps:
          type: integer
          enum: [24, 30, 60]
        quality:
          type: string
          enum: [draft, standard, high]
        format:
          type: string
          enum: [mp4, webm, mov, png-sequence]
        resolution:
          type: string
          enum: [landscape, portrait, square, landscape-4k, portrait-4k, square-4k]
        transparent:
          type: boolean
        watermark:
          type: boolean
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/RenderTransition"

    RenderSettingsInput:
      type: object
      description: Partial render settings; omitted fields keep their current value.
      properties:
        fps:
          type: integer
          enum: [24, 30, 60]
        quality:
          type: string
          enum: [draft, standard, high]
        format:
          type: string
          enum: [mp4, webm, mov, png-sequence]
        resolution:
          type: string
          enum: [landscape, portrait, square, landscape-4k, portrait-4k, square-4k]
        transparent:
          type: boolean
        watermark:
          type: boolean
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/RenderTransition"

    LintMessage:
      type: object
      required: [severity, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string
        line:
          type: integer
        rule:
          type: string

    LintRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string

    LintResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/LintMessage"

    BrandKit:
      type: object
      required: [id, primaryColor, secondaryColor, fontFamily, updatedAt]
      properties:
        id:
          type: integer
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: ["string", "null"]
        fontFamily:
          type: string
        companyName:
          type: ["string", "null"]
        brandVoice:
          type: ["string", "null"]
          enum: [professional, playful, bold, minimal, null]
        voiceDescription:
          type: ["string", "null"]
        updatedAt:
          type: string

    BrandKitInput:
      type: object
      properties:
        logoUrl:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        companyName:
          type: string
        brandVoice:
          type: string
          enum: [professional, playful, bold, minimal]
        voiceDescription:
          type: string
          maxLength: 500

    Module:
      type: object
      required: [id, name, slug, description, icon, status]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        status:
          type: string
          enum: [active, coming_soon, beta]
        features:
          type: array
          items:
            type: string

    BillingInfo:
      type: object
      required: [plan, renderCount, aiCount]
      properties:
        plan:
          type: string
          enum: [free, pro]
        renderCount:
          type: integer
        renderLimit:
          type: ["integer", "null"]
        renderResetAt:
          type: ["string", "null"]
        aiCount:
          type: integer
        aiLimit:
          type: ["integer", "null"]
        aiResetAt:
          type: ["string", "null"]
        stripeCustomerId:
          type: ["string", "null"]

    AiSuggestRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 500

    CropRegion:
      type: object
      description: >-
        A region to FEATURE, as 0–1 fractions of the captured screenshot
        (x/y = top-left, w/h = size). Clamped server-side; w/h are floored so a
        tiny selection can't zoom to infinity.
      required: [x, y, w, h]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }

    WebsiteToVideoPreviewRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The public website URL to capture (http/https only).
          maxLength: 2048

    WebsiteToVideoPreviewResponse:
      type: object
      required: [previewId, image, width, height]
      properties:
        previewId:
          type: string
          description: Pass back to POST /website-to-video with a `crop` to render.
        image:
          type: string
          description: The captured screenshot as a data URI (for the crop UI).
        width:
          type: integer
          description: Screenshot width in px (the crop fractions are relative to this).
        height:
          type: integer
          description: Screenshot height in px.

    WebsiteToVideoRequest:
      type: object
      description: >-
        Provide either `url` (capture fresh — the one-shot flow) or `previewId`
        (from POST /website-to-video/preview — the crop flow). Exactly one.
      properties:
        url:
          type: string
          description: The public website URL to capture (http/https only).
          maxLength: 2048
        previewId:
          type: string
          description: >-
            Id from a prior /website-to-video/preview call. When set, that
            already-captured screenshot is reused and `crop` features a region.
          maxLength: 128
        crop:
          $ref: "#/components/schemas/CropRegion"
        duration:
          type: integer
          description: >-
            Video length in seconds. Clamped server-side to 3–60; defaults to 9.
            The intro/outro are fixed-length and the page scroll stretches to fill
            the rest, so a longer value simply scrolls the page more slowly.
          minimum: 3
          maximum: 60

    AiSuggestResult:
      type: object
      required: [headline, bodyText, ctaText]
      properties:
        headline:
          type: string
        bodyText:
          type: string
        ctaText:
          type: string

    CheckoutRequest:
      type: object
      required: [priceId]
      properties:
        priceId:
          type: string

    CheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: ["string", "null"]

    PortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: ["string", "null"]

    BillingPrice:
      type: object
      required: [id, currency]
      properties:
        id:
          type: string
        unitAmount:
          type: ["integer", "null"]
        currency:
          type: string
        interval:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]

    PricesResponse:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/BillingPrice"

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. image/jpeg).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    FinalizeUploadRequest:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          minLength: 1
          description: The objectPath (or raw GCS upload URL) returned by request-url.
    FinalizeUploadResult:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          description: Normalized object path now owned by the caller (e.g. /objects/uploads/uuid).

    PlatformStats:
      type: object
      required: [totalProjects, totalTemplates, videosRendered, activeModules]
      properties:
        totalProjects:
          type: integer
        totalTemplates:
          type: integer
        videosRendered:
          type: integer
        activeModules:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
