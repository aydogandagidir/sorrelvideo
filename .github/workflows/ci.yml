name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs for the same branch when a new push comes in.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-time env. Real secrets are never needed here — integration tests spin
  # up their own Postgres testcontainer in globalSetup; the dummy URL below is
  # only there so pg.Pool's import-time validation passes for unit tests.
  NODE_ENV: test
  PORT: "8080"
  BASE_PATH: /
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/sorrel_test
  SESSION_SECRET: ci-session-secret
  ALLOWED_ORIGINS: http://localhost:5173
  APP_URL: http://localhost:8080
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_PUBLISHABLE_KEY: pk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  # Skip the Chromium download during pnpm install — render tests are skipped
  # in CI for now, so we don't need a browser binary.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI codegen is up to date
        run: |
          pnpm --filter @workspace/api-spec run codegen
          if ! git diff --quiet; then
            echo "::error::Generated API files are stale. Run 'pnpm --filter @workspace/api-spec run codegen' and commit." >&2
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        # globalSetup boots a Postgres testcontainer and runs `db push` against
        # it; no service container needed.
        run: pnpm test

      - name: Build
        # mockup-sandbox is a dev-only playground; only the shipping packages
        # need a production build. Typecheck above still covers everything.
        run: pnpm --filter @workspace/api-server --filter @workspace/sorrel run build
