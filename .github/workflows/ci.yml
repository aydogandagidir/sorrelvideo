name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs for the same branch when a new push comes in.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-time env. Real secrets are never needed here — integration tests spin
  # up their own Postgres testcontainer in globalSetup; the dummy URL below is
  # only there so pg.Pool's import-time validation passes for unit tests.
  NODE_ENV: test
  PORT: "8080"
  BASE_PATH: /
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/sorrel_test
  SESSION_SECRET: ci-session-secret
  ALLOWED_ORIGINS: http://localhost:5173
  APP_URL: http://localhost:8080
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_PUBLISHABLE_KEY: pk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  # Skip the Chromium download during pnpm install — render tests are skipped
  # in CI for now, so we don't need a browser binary.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  # Opt the bundled JS actions (checkout / setup-node / pnpm) into Node 24 ahead
  # of GitHub forcing it (Jun 2026); silences the Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pin EXACT (matches package.json packageManager + the Dockerfile's
          # corepack) so local / CI / Docker all run the same pnpm. A floating
          # `10` silently drifted to 10.34.4 and changed @puppeteer/browsers'
          # behavior, breaking the Railway Docker build — see #153.
          version: 10.34.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI codegen is up to date
        run: |
          pnpm --filter @workspace/api-spec run codegen
          if ! git diff --quiet; then
            echo "::error::Generated API files are stale. Run 'pnpm --filter @workspace/api-spec run codegen' and commit." >&2
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        # globalSetup boots a Postgres testcontainer and runs `db push` against
        # it; no service container needed.
        run: pnpm test

      - name: Build
        # Build every package the Docker image SHIPS: api-server, the sorrel SPA,
        # AND the embedded studio-editor (Dockerfile builds it too). studio-editor
        # runs its OWN vite/tailwind majors (different from sorrel's catalog), so
        # without it here a breaking bump passed CI green and only failed at the
        # Railway deploy. mockup-sandbox stays excluded (dev-only, never shipped).
        run: pnpm --filter @workspace/api-server --filter @workspace/sorrel --filter @workspace/studio-editor run build

  docker-build:
    name: Docker build (deploy parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build through the `build` stage of the SAME Dockerfile Railway deploys.
      # The `validate` job never builds the Dockerfile, so a whole class of
      # failures only surfaced at deploy: the chrome-headless-shell extraction
      # (a @puppeteer/browsers shape change broke it — #153), native postinstall
      # shape changes (sharp/puppeteer under a drifted pnpm), and the
      # studio-editor build. `--target build` runs deps (the REAL `pnpm install`
      # + postinstalls), typecheck, every shipped build, AND the chrome-headless-
      # shell step — every step that has bitten us — while skipping the slow
      # runtime apt layer. GHA cache keeps warm runs to a few minutes.
      - name: Build the Docker `build` stage (deploy parity)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            VITE_GIT_SHA=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
