name: Deploy

on:
  # Wait for CI to land green on main; we listen to its workflow_run event
  # rather than a raw push so a broken main never auto-ships.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Opt the bundled JS actions into Node 24 ahead of GitHub forcing it (Jun 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy to Railway
    # Only when CI itself passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # Deploy is OPT-IN: it runs only once a RAILWAY_TOKEN secret exists. Until
      # then (e.g. Railway not provisioned yet — see DEPLOYMENT.md) every step
      # below is skipped and the job goes GREEN with a notice, instead of failing
      # red on every merge to main. Adding the secret auto-activates the deploy —
      # no workflow edit needed.
      - name: Check Railway is configured
        id: cfg
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::RAILWAY_TOKEN is not set. Provision Railway (an 'api' service) and add the RAILWAY_TOKEN repo secret to enable auto-deploy — see DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        if: steps.cfg.outputs.configured == 'true'
        # Pipe to bash, NOT sh: the install script uses bash-only parameter
        # expansion (`${value//.../...}`) + `local`, which Ubuntu's /bin/sh (dash)
        # rejects with "Bad substitution" (exit 2) AFTER copying the binary — so
        # every deploy died here before reaching Railway. bash runs it cleanly.
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      # Pin the release SHA Railway uses for THIS build. `railway up` builds the
      # Dockerfile on Railway's builders and has no --build-arg flag — Railway
      # forwards matching service variables into the build as ARGs instead. So we
      # set the SHA-derived vars as service variables first (--skip-deploys avoids
      # triggering an extra deploy). GIT_SHA → runtime API Sentry release;
      # VITE_GIT_SHA → the Dockerfile ARG the SPA build reads (frontend Sentry
      # release). The static VITE_SENTRY_DSN / VITE_SENTRY_TRACES_SAMPLE_RATE are
      # operator-managed service variables (see DEPLOYMENT.md), not set here.
      - name: Pin release SHA as build/runtime variables
        if: steps.cfg.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables --service api --skip-deploys \
            --set "GIT_SHA=$GIT_SHA" \
            --set "VITE_GIT_SHA=$GIT_SHA"

      - name: Deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --detach
