version: 2
updates:
  # Keep GitHub Actions current (also avoids runner/Node deprecations).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # npm / pnpm workspace dependencies. Minor + patch are grouped to cut noise;
  # majors come as individual PRs for careful review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # orval generates the committed API client + Zod code (lib/api-client-react,
      # lib/api-zod). Auto-bumping it makes those files drift, which fails the
      # "codegen up to date" CI check — and Dependabot can't run codegen to fix
      # it. Upgrade orval deliberately instead: bump it, run
      # `pnpm --filter @workspace/api-spec run codegen`, and commit together.
      - dependency-name: "orval"
      # react-day-picker v10 is a breaking major that doesn't type-check against
      # the shadcn calendar component. Allow v9.x patches but block majors until
      # the component is deliberately migrated.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      # react-resizable-panels v4 drops the `PanelGroup` / `PanelResizeHandle`
      # named exports the shadcn `resizable.tsx` wrapper relies on, so a major
      # bump fails typecheck in both sorrel and mockup-sandbox. Allow v2.x
      # patches but block majors until the component is deliberately migrated.
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      # lucide-react v1 removes the brand icons (e.g. Github, Google) that
      # oauth-buttons.tsx imports, so a major bump fails sorrel's typecheck.
      # Allow v0.x updates but block majors until the icons are migrated.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # ioredis is pinned EXACTLY by bullmq (e.g. bullmq@5.77.6 -> ioredis@5.10.1).
      # Bumping our direct ioredis ahead of bullmq's pin installs a second copy,
      # and passing our newer ioredis client to bullmq's Queue/Worker `connection`
      # fails typecheck (nominal AbstractConnector mismatch). Keep ioredis aligned
      # with bullmq's pinned version — upgrade both together when bumping bullmq.
      - dependency-name: "ioredis"
