version: 2
updates:
  # Keep GitHub Actions current (also avoids runner/Node deprecations).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # npm / pnpm workspace dependencies. Minor + patch are grouped to cut noise;
  # majors come as individual PRs for careful review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # orval generates the committed API client + Zod code (lib/api-client-react,
      # lib/api-zod). Auto-bumping it makes those files drift, which fails the
      # "codegen up to date" CI check — and Dependabot can't run codegen to fix
      # it. Upgrade orval deliberately instead: bump it, run
      # `pnpm --filter @workspace/api-spec run codegen`, and commit together.
      - dependency-name: "orval"
      # react-day-picker v10 is a breaking major that doesn't type-check against
      # the shadcn calendar component. Allow v9.x patches but block majors until
      # the component is deliberately migrated.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
