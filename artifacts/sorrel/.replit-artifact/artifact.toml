kind = "web"
previewPath = "/"
title = "Sorrel"
version = "1.0.0"
id = "artifacts/sorrel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20733

[services.development]
run = "pnpm --filter @workspace/sorrel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sorrel", "run", "build" ]
publicDir = "artifacts/sorrel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20733"
BASE_PATH = "/"
