<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #07070b;
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%; height: 100%; position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 130px 90px;
        background:
          radial-gradient(circle at 50% 8%, {{brand.primaryColor}}66, transparent 50%),
          linear-gradient(180deg, #07070b 30%, {{brand.secondaryColor}} 170%);
      }
      .badge {
        display: inline-block; padding: 18px 42px; border-radius: 999px;
        background: {{brand.accentColor}}; color: #07070b;
        font-size: 30px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
        margin-bottom: 70px;
      }
      .headline {
        font-size: 128px; font-weight: 900; line-height: 1.0; letter-spacing: -3px; max-width: 900px;
        background: linear-gradient(120deg, #fff 35%, {{brand.accentColor}});
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .body { font-size: 46px; line-height: 1.42; margin-top: 56px; max-width: 860px; color: rgba(255,255,255,0.82); }
      .cta {
        margin-top: 100px; padding: 38px 72px; border-radius: 999px;
        background: linear-gradient(135deg, {{brand.primaryColor}}, {{brand.accentColor}});
        color: #fff; font-size: 42px; font-weight: 800;
        box-shadow: 0 24px 70px {{brand.primaryColor}}55;
      }
      .footer { position: absolute; bottom: 110px; font-size: 34px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.6); }
      .anim { will-change: opacity, transform; }
    </style>
  </head>
  <body>
    <div class="scene" data-composition-id="product-launch" data-duration="6">
      <div class="badge anim" data-from="0.15" data-to="0.9" data-slide="28">
        New
      </div>
      <h1 class="headline anim" data-from="0.4" data-to="1.4" data-slide="44">
        {{user.headline}}
      </h1>
      <p class="body anim" data-from="0.9" data-to="1.9" data-slide="32">
        {{user.bodyText}}
      </p>
      <div class="cta anim" data-from="1.4" data-to="2.2" data-slide="24">
        {{user.ctaText}}
      </div>
      <div class="footer anim" data-from="1.9" data-to="2.6" data-slide="14">
        {{brand.companyName}}
      </div>
    </div>
    <script>
      (function () {
        var DURATION = 6;
        var items = Array.prototype.slice
          .call(document.querySelectorAll(".anim"))
          .map(function (el) {
            return {
              el: el,
              from: parseFloat(el.getAttribute("data-from")) || 0,
              to: parseFloat(el.getAttribute("data-to")) || DURATION,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });
        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function render(t) {
          for (var i = 0; i < items.length; i++) {
            var it = items[i],
              span = it.to - it.from;
            var raw = span > 0 ? (t - it.from) / span : t >= it.from ? 1 : 0;
            var p = easeOut(clamp01(raw));
            it.el.style.opacity = String(p);
            it.el.style.transform = "translateY(" + (1 - p) * it.slide + "px)";
          }
        }
        window.__hf = {
          duration: DURATION,
          seek: function (t) {
            render(Math.max(0, Math.min(DURATION, Number(t) || 0)));
          },
        };
      })();
    </script>
  </body>
</html>
