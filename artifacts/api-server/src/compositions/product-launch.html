<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  .scene {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
  }
  .bg-circle.c1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(120,80,255,0.3), transparent 70%);
    top: -100px; left: -100px;
  }
  .bg-circle.c2 {
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(255,80,120,0.2), transparent 70%);
    bottom: -200px; right: -200px;
    animation-delay: -1.5s;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  .badge {
    background: rgba(120,80,255,0.3);
    border: 1px solid rgba(120,80,255,0.6);
    border-radius: 100px;
    padding: 8px 28px;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c4b5fd;
    animation: fadeSlideDown 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.2s;
  }
  .headline {
    font-size: 96px;
    font-weight: 900;
    line-height: 1.05;
    text-align: center;
    margin-top: 32px;
    background: linear-gradient(135deg, #fff 40%, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeSlideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.5s;
  }
  .subline {
    font-size: 32px;
    color: rgba(255,255,255,0.6);
    margin-top: 24px;
    text-align: center;
    max-width: 800px;
    animation: fadeSlideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.8s;
  }
  .cta {
    margin-top: 56px;
    background: linear-gradient(135deg, #7c50ff, #e040fb);
    border: none;
    border-radius: 12px;
    padding: 20px 56px;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    animation: fadeSlideUp 0.8s ease forwards, shimmer 2s linear 1.5s infinite;
    opacity: 0;
    animation-delay: 1.1s;
    position: relative;
    overflow: hidden;
  }
  .cta::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 2s linear 1.5s infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(196,181,253,0.6);
    animation: float linear infinite;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="particles" id="particles"></div>
  <div class="badge">New Launch</div>
  <h1 class="headline">Product Launch<br/>Teaser</h1>
  <p class="subline">The next generation of video production is here. Meet Sorrel.</p>
  <div class="cta">Get Early Access</div>
</div>
<script>
  const container = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDuration = (4 + Math.random() * 8) + 's';
    p.style.animationDelay = -(Math.random() * 12) + 's';
    p.style.opacity = 0.2 + Math.random() * 0.6;
    p.style.transform = `scale(${0.5 + Math.random() * 2})`;
    container.appendChild(p);
  }
</script>
</body>
</html>
