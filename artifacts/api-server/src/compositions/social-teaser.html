<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  .scene {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: conic-gradient(from 180deg at 50% 50%, #ff0080, #7928ca, #ff0080 30%, #0070f3, #ff0080 70%);
    opacity: 0.15;
    animation: rotate 8s linear infinite;
  }
  @keyframes rotate {
    to { transform: rotate(360deg) scale(2); }
  }
  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .content {
    text-align: center;
    z-index: 10;
    position: relative;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    padding: 10px 28px;
    font-size: 20px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeIn 0.6s ease 0.2s forwards;
    opacity: 0;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff0080;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  .title {
    font-size: 120px;
    font-weight: 900;
    line-height: 0.95;
    margin-top: 36px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.5) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: scaleIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards;
    opacity: 0;
    transform: scale(0.8);
  }
  .highlight {
    background: linear-gradient(135deg, #ff0080, #7928ca);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 28px;
    color: rgba(255,255,255,0.4);
    margin-top: 28px;
    letter-spacing: 1px;
    animation: fadeIn 0.6s ease 0.9s forwards;
    opacity: 0;
  }
  .pills {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 48px;
    animation: fadeIn 0.6s ease 1.1s forwards;
    opacity: 0;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 14px 32px;
    font-size: 18px;
    color: rgba(255,255,255,0.7);
  }
  .pill.accent {
    background: linear-gradient(135deg, #ff0080, #7928ca);
    border-color: transparent;
    color: #fff;
    font-weight: 700;
  }
  .corner-decoration {
    position: absolute;
    width: 300px; height: 300px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 50%;
    animation: expand 4s ease-out infinite;
  }
  .corner-decoration:nth-child(2) { animation-delay: -1s; }
  .corner-decoration:nth-child(3) { animation-delay: -2s; }
  @keyframes expand {
    from { transform: scale(0); opacity: 0.4; }
    to { transform: scale(4); opacity: 0; }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes scaleIn {
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-gradient"></div>
  <div class="grid-lines"></div>
  <div class="corner-decoration"></div>
  <div class="corner-decoration"></div>
  <div class="corner-decoration"></div>
  <div class="content">
    <div class="eyebrow"><div class="dot"></div>Social Teaser<div class="dot"></div></div>
    <h1 class="title">Go <span class="highlight">Viral</span><br/>Today</h1>
    <p class="sub">Create scroll-stopping social content in minutes</p>
    <div class="pills">
      <div class="pill">Instagram</div>
      <div class="pill">TikTok</div>
      <div class="pill accent">▶ Watch Now</div>
      <div class="pill">YouTube</div>
      <div class="pill">Twitter/X</div>
    </div>
  </div>
</div>
</body>
</html>
