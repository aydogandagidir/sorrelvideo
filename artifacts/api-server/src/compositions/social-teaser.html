<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #050507;
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%; height: 100%; position: relative;
        /* Stacking context so the z-index:-1 .ai-bg-layer renders ABOVE this
           scene's own background (a negative-z child otherwise paints behind the
           parent's opaque background — the AI image would never show). */
        isolation: isolate;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 120px 80px;
        background:
          radial-gradient(circle at 25% 22%, {{brand.primaryColor}}55, transparent 42%),
          radial-gradient(circle at 80% 80%, {{brand.accentColor}}44, transparent 42%),
          #050507;
      }
      /* AI background image (generative media) — z-index:-1 paints above the
         .scene gradient but below the in-flow content; a scrim keeps overlay
         text readable. ai.backgroundImage unset → src="" collapses the layer, so
         a no-AI render is byte-identical to the authored gradient. */
      .ai-bg-layer { position: absolute; inset: 0; z-index: -1; }
      .ai-bg-layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .ai-bg-layer::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(5, 5, 7, 0.5), rgba(5, 5, 7, 0.72));
      }
      .ai-bg-layer:has(img[src=""]) { display: none; }
      .kicker {
        font-size: 34px; font-weight: 800; letter-spacing: 10px; text-transform: uppercase;
        color: {{brand.accentColor}}; margin-bottom: 56px;
      }
      .headline { font-size: 156px; font-weight: 900; line-height: 0.98; letter-spacing: -4px; max-width: 920px; }
      .body { font-size: 48px; line-height: 1.4; margin-top: 60px; max-width: 860px; color: rgba(255,255,255,0.85); }
      .cta {
        margin-top: 100px; padding: 36px 80px; border-radius: 999px;
        border: 5px solid {{brand.accentColor}}; color: {{brand.accentColor}};
        font-size: 42px; font-weight: 800; letter-spacing: 1px;
      }
      .anim { will-change: opacity, transform; }
    </style>
  </head>
  <body>
    <div class="scene" data-composition-id="social-teaser" data-duration="4">
      <div class="ai-bg-layer">
        <img
          class="ai-bg"
          src="{{ai.backgroundImage}}"
          alt=""
          onerror="this.parentElement.style.display='none'"
        />
      </div>
      <div class="kicker anim" data-from="0.1" data-to="0.7" data-slide="18">
        {{brand.companyName}}
      </div>
      <h1 class="headline anim" data-from="0.3" data-to="1.2" data-slide="38">
        {{user.headline}}
      </h1>
      <p class="body anim" data-from="0.8" data-to="1.6" data-slide="26">
        {{user.bodyText}}
      </p>
      <div class="cta anim" data-from="1.2" data-to="2.0" data-slide="18">
        {{user.ctaText}}
      </div>
    </div>
    <script>
      (function () {
        var DURATION = 4;
        var items = Array.prototype.slice
          .call(document.querySelectorAll(".anim"))
          .map(function (el) {
            return {
              el: el,
              from: parseFloat(el.getAttribute("data-from")) || 0,
              to: parseFloat(el.getAttribute("data-to")) || DURATION,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });
        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function render(t) {
          for (var i = 0; i < items.length; i++) {
            var it = items[i],
              span = it.to - it.from;
            var raw = span > 0 ? (t - it.from) / span : t >= it.from ? 1 : 0;
            var p = easeOut(clamp01(raw));
            it.el.style.opacity = String(p);
            it.el.style.transform =
              "scale(" +
              (0.94 + p * 0.06) +
              ") translateY(" +
              (1 - p) * it.slide +
              "px)";
          }
        }
        window.__hf = {
          duration: DURATION,
          seek: function (t) {
            render(Math.max(0, Math.min(DURATION, Number(t) || 0)));
          },
        };
      })();
    </script>
  </body>
</html>
