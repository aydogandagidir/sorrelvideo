<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #050507;
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%; height: 100%; position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 120px;
        background:
          radial-gradient(circle at 30% 30%, {{brand.primaryColor}}55, transparent 45%),
          radial-gradient(circle at 70% 75%, {{brand.accentColor}}44, transparent 45%),
          #050507;
      }
      .kicker {
        font-size: 32px; font-weight: 800; letter-spacing: 8px; text-transform: uppercase;
        color: {{brand.accentColor}}; margin-bottom: 48px;
      }
      .headline {
        font-size: 172px; font-weight: 900; line-height: 0.98; letter-spacing: -5px; max-width: 1500px;
        color: #fff;
      }
      .body { font-size: 44px; line-height: 1.4; margin-top: 52px; max-width: 1150px; color: rgba(255,255,255,0.85); }
      .cta {
        margin-top: 90px; padding: 32px 72px; border-radius: 999px;
        border: 4px solid {{brand.accentColor}}; color: {{brand.accentColor}};
        font-size: 38px; font-weight: 800; letter-spacing: 1px;
      }
      .anim { opacity: 0; will-change: opacity, transform; }
    </style>
  </head>
  <body>
    <div class="scene" data-composition-id="social-teaser" data-duration="4">
      <div class="kicker anim" data-from="0.15" data-to="0.7" data-slide="20">
        {{brand.companyName}}
      </div>
      <h1 class="headline anim" data-from="0.4" data-to="1.2" data-slide="40">
        {{user.headline}}
      </h1>
      <p class="body anim" data-from="0.9" data-to="1.6" data-slide="28">
        {{user.bodyText}}
      </p>
      <div class="cta anim" data-from="1.3" data-to="2.0" data-slide="20">
        {{user.ctaText}}
      </div>
    </div>
    <script>
      (function () {
        var DURATION = 4;
        var items = Array.prototype.slice
          .call(document.querySelectorAll(".anim"))
          .map(function (el) {
            return {
              el: el,
              from: parseFloat(el.getAttribute("data-from")) || 0,
              to: parseFloat(el.getAttribute("data-to")) || DURATION,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });
        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function render(t) {
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            var span = it.to - it.from;
            var raw = span > 0 ? (t - it.from) / span : t >= it.from ? 1 : 0;
            var p = easeOut(clamp01(raw));
            it.el.style.opacity = String(p);
            it.el.style.transform =
              "scale(" +
              (0.92 + p * 0.08) +
              ") translateY(" +
              (1 - p) * it.slide +
              "px)";
          }
        }
        render(0);
        window.__hf = {
          duration: DURATION,
          seek: function (t) {
            render(Math.max(0, Math.min(DURATION, Number(t) || 0)));
          },
        };
      })();
    </script>
  </body>
</html>
