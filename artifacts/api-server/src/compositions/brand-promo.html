<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: {{brand.secondaryColor}};
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%; height: 100%; position: relative; padding: 150px 96px;
        display: flex; flex-direction: column; justify-content: center;
        background: linear-gradient(155deg, {{brand.secondaryColor}} 0%, #08080d 75%);
      }
      .bar { position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(90deg, {{brand.primaryColor}}, {{brand.accentColor}}); }
      .brand { display: flex; align-items: center; gap: 28px; margin-bottom: 90px; }
      .brand-logo {
        width: 120px; height: 120px; border-radius: 30px;
        background: linear-gradient(135deg, {{brand.primaryColor}}, {{brand.accentColor}});
        display: flex; align-items: center; justify-content: center; font-size: 62px; font-weight: 800;
      }
      .brand-name { font-size: 42px; font-weight: 800; }
      .headline { font-size: 116px; font-weight: 900; line-height: 1.04; letter-spacing: -2px; max-width: 880px; }
      .accent-line { width: 200px; height: 16px; border-radius: 8px; background: {{brand.accentColor}}; margin: 60px 0; }
      .body { font-size: 46px; line-height: 1.45; max-width: 840px; color: rgba(255,255,255,0.82); }
      .cta {
        display: inline-flex; margin-top: 90px; padding: 36px 64px; border-radius: 18px; width: fit-content;
        background: {{brand.accentColor}}; color: #08080d; font-size: 40px; font-weight: 800;
      }
      .anim { will-change: opacity, transform; }
    </style>
  </head>
  <body>
    <div class="scene" data-composition-id="brand-promo" data-duration="5">
      <div class="bar"></div>
      <div class="brand anim" data-from="0.15" data-to="0.9" data-slide="-34">
        <div class="brand-logo">{{brand.initial}}</div>
        <div class="brand-name">{{brand.companyName}}</div>
      </div>
      <h1 class="headline anim" data-from="0.4" data-to="1.4" data-slide="42">
        {{user.headline}}
      </h1>
      <div
        class="accent-line anim"
        data-from="0.9"
        data-to="1.5"
        data-slide="0"
      ></div>
      <p class="body anim" data-from="1.1" data-to="2.0" data-slide="30">
        {{user.bodyText}}
      </p>
      <div class="cta anim" data-from="1.6" data-to="2.4" data-slide="22">
        {{user.ctaText}} &rarr;
      </div>
    </div>
    <script>
      (function () {
        var DURATION = 5;
        var items = Array.prototype.slice
          .call(document.querySelectorAll(".anim"))
          .map(function (el) {
            return {
              el: el,
              from: parseFloat(el.getAttribute("data-from")) || 0,
              to: parseFloat(el.getAttribute("data-to")) || DURATION,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });
        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function render(t) {
          for (var i = 0; i < items.length; i++) {
            var it = items[i],
              span = it.to - it.from;
            var raw = span > 0 ? (t - it.from) / span : t >= it.from ? 1 : 0;
            var p = easeOut(clamp01(raw));
            it.el.style.opacity = String(p);
            it.el.style.transform = "translateX(" + (1 - p) * it.slide + "px)";
          }
        }
        window.__hf = {
          duration: DURATION,
          seek: function (t) {
            render(Math.max(0, Math.min(DURATION, Number(t) || 0)));
          },
        };
      })();
    </script>
  </body>
</html>
