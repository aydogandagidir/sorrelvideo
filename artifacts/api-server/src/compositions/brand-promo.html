<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  .scene {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
  }
  .left {
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 80px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    position: relative;
    overflow: hidden;
  }
  .left::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,53,0.15), transparent 70%);
    bottom: -100px; right: -100px;
  }
  .right {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff6b35, #f7c59f);
    position: relative;
    overflow: hidden;
  }
  .right::after {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    top: -200px; right: -200px;
  }
  .eyebrow {
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ff6b35;
    animation: fadeIn 0.6s ease 0.2s forwards;
    opacity: 0;
  }
  .title {
    font-size: 80px;
    font-weight: 900;
    line-height: 1.05;
    margin-top: 20px;
    animation: slideRight 0.7s ease 0.4s forwards;
    opacity: 0;
  }
  .desc {
    font-size: 22px;
    color: rgba(255,255,255,0.55);
    margin-top: 28px;
    max-width: 480px;
    line-height: 1.6;
    animation: fadeIn 0.6s ease 0.7s forwards;
    opacity: 0;
  }
  .stats {
    display: flex;
    gap: 48px;
    margin-top: 56px;
    animation: fadeIn 0.6s ease 1s forwards;
    opacity: 0;
  }
  .stat-val {
    font-size: 48px;
    font-weight: 900;
    color: #ff6b35;
  }
  .stat-label {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .logo-area {
    text-align: center;
    z-index: 1;
    animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
    opacity: 0;
    transform: scale(0.6);
  }
  .logo-circle {
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 96px;
    backdrop-filter: blur(10px);
    animation: spin 20s linear infinite;
    margin: 0 auto;
  }
  .brand-name {
    font-size: 40px;
    font-weight: 800;
    color: rgba(0,0,0,0.8);
    margin-top: 32px;
    letter-spacing: -1px;
  }
  .brand-tagline {
    font-size: 18px;
    color: rgba(0,0,0,0.5);
    margin-top: 8px;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="left">
    <div class="eyebrow">Brand Identity</div>
    <h1 class="title">Your Brand.<br/>Amplified.</h1>
    <p class="desc">Create stunning branded video content in minutes. Consistent, professional, and on-brand every time.</p>
    <div class="stats">
      <div>
        <div class="stat-val">10×</div>
        <div class="stat-label">Faster</div>
      </div>
      <div>
        <div class="stat-val">100%</div>
        <div class="stat-label">On Brand</div>
      </div>
      <div>
        <div class="stat-val">∞</div>
        <div class="stat-label">Variations</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="logo-area">
      <div class="logo-circle">🎬</div>
      <div class="brand-name">Sorrel</div>
      <div class="brand-tagline">Video Production Platform</div>
    </div>
  </div>
</div>
</body>
</html>
