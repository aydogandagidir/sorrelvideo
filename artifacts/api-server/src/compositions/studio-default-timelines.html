<!doctype html>
<!--
  Studio default __timelines composition (M9 Phase 4).

  Seeds a newly-opened Studio workspace with a self-contained
  `@hyperframes/player`-runtime composition. Unlike the legacy
  studio-default.html (a {{placeholder}} template the render service merges
  brand-kit + compositionVars into), this document is FINAL HTML the Studio
  edits and previews directly: it registers a real timeline on
  `window.__timelines["studio-default"]` so the Studio's timeline panel can read
  `duration()`, `seek(ms)`, and the per-clip `data-start`/`data-duration`/
  `data-track-index` metadata to lay out tracks.

  The root carries `data-composition-id` / `data-width` / `data-height` (the
  Studio reads these to size the canvas). Timeline times are in MILLISECONDS
  (the Studio panel works in ms); the seek interface accepts ms and drives the
  same opacity/translate intro the legacy composition uses, so a render of this
  document produces a non-blank clip even if the host never seeks.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07070b;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 130px 96px;
        background:
          radial-gradient(circle at 78% 12%, #6366f155, transparent 45%),
          radial-gradient(circle at 15% 88%, #f59e0b33, transparent 45%),
          linear-gradient(160deg, #0b0b12 0%, #07070b 60%, #1e293b 160%);
      }
      .glow {
        position: absolute;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, #6366f140, transparent 70%);
        top: -200px;
        right: -220px;
        filter: blur(40px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 26px;
        margin-bottom: 90px;
      }
      .brand-logo {
        width: 110px;
        height: 110px;
        border-radius: 28px;
        background: linear-gradient(135deg, #6366f1, #f59e0b);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 56px;
        font-weight: 800;
        color: #fff;
        box-shadow: 0 20px 60px #6366f166;
      }
      .brand-name {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .headline {
        font-size: 118px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -3px;
        background: linear-gradient(120deg, #ffffff 30%, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .body {
        font-size: 44px;
        line-height: 1.45;
        margin-top: 56px;
        max-width: 820px;
        color: rgba(255, 255, 255, 0.82);
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        margin-top: 110px;
        padding: 36px 64px;
        width: fit-content;
        background: linear-gradient(135deg, #6366f1, #f59e0b);
        color: #fff;
        border-radius: 999px;
        font-size: 40px;
        font-weight: 800;
        box-shadow: 0 24px 70px #6366f155;
      }
      .progress {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 90px;
        height: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .progress > span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #f59e0b);
      }
      /* Visible by DEFAULT (opacity:1) so the clip is never blank even if the
         host never seeks. seek(ms) layers the intro on top. */
      .clip {
        will-change: opacity, transform;
      }
    </style>
  </head>
  <body>
    <!-- Root carries the composition id + canvas size the Studio reads. -->
    <div
      class="scene"
      data-composition-id="studio-default"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <div class="glow"></div>

      <!-- Each .clip is a timeline clip: data-start / data-duration are in MS,
           data-track-index lays it out on a Studio track row. -->
      <div
        id="brand-badge"
        class="clip brand"
        data-start="100"
        data-duration="700"
        data-track-index="0"
        data-slide="-36"
      >
        <div class="brand-logo">S</div>
        <div class="brand-name">Your Brand</div>
      </div>
      <h1
        id="headline"
        class="clip headline"
        data-start="350"
        data-duration="950"
        data-track-index="1"
        data-slide="46"
      >
        Make something<br />they'll remember.
      </h1>
      <p
        id="body-text"
        class="clip body"
        data-start="800"
        data-duration="900"
        data-track-index="2"
        data-slide="34"
      >
        Sorrel turns a template, your brand kit, and a few sentences into branded
        video — ready to ship.
      </p>
      <div
        id="cta-button"
        class="clip cta"
        data-start="1200"
        data-duration="800"
        data-track-index="3"
        data-slide="26"
      >
        Try it free &rarr;
      </div>

      <div class="progress"><span id="pbar"></span></div>
    </div>

    <script>
      (function () {
        var COMPOSITION_ID = "studio-default";
        var DURATION_MS = 5000;

        // Build the clip list straight from the DOM so editing data-* attrs in
        // the Studio updates the timeline with no JS changes.
        var clips = Array.prototype.slice
          .call(document.querySelectorAll(".clip"))
          .map(function (el) {
            var start = parseFloat(el.getAttribute("data-start")) || 0;
            var duration = parseFloat(el.getAttribute("data-duration")) || 0;
            return {
              el: el,
              id: el.className.replace("clip", "").trim() || "clip",
              start: start,
              duration: duration,
              trackIndex: parseInt(el.getAttribute("data-track-index"), 10) || 0,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });

        var pbar = document.getElementById("pbar");

        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }

        // Drive every clip's intro from an absolute time in MS.
        function renderAt(ms) {
          var t = Math.max(0, Math.min(DURATION_MS, Number(ms) || 0));
          for (var i = 0; i < clips.length; i++) {
            var c = clips[i];
            var raw =
              c.duration > 0
                ? (t - c.start) / c.duration
                : t >= c.start
                  ? 1
                  : 0;
            var p = easeOut(clamp01(raw));
            c.el.style.opacity = String(p);
            c.el.style.transform = "translateY(" + (1 - p) * c.slide + "px)";
          }
          if (pbar) pbar.style.width = clamp01(t / DURATION_MS) * 100 + "%";
        }

        // The timeline object the Studio panel consumes. duration() is in MS;
        // seek(ms) accepts MS. `clips` exposes the per-clip layout metadata so
        // the panel can render track rows without re-parsing the DOM.
        var timeline = {
          id: COMPOSITION_ID,
          duration: function () {
            return DURATION_MS;
          },
          seek: function (ms) {
            renderAt(ms);
          },
          clips: clips.map(function (c) {
            return {
              id: c.id,
              start: c.start,
              duration: c.duration,
              trackIndex: c.trackIndex,
            };
          }),
        };

        // Register on the shared __timelines registry the Studio reads.
        window.__timelines = window.__timelines || {};
        window.__timelines[COMPOSITION_ID] = timeline;

        // Back-compat with the legacy player host (window.__hf.seek expects
        // SECONDS) so this document also renders through the existing pipeline.
        window.__hf = {
          duration: DURATION_MS / 1000,
          seek: function (seconds) {
            renderAt((Number(seconds) || 0) * 1000);
          },
        };

        // Do NOT renderAt(0) at load — CSS keeps the frame full; the first real
        // seek starts the intro.
      })();
    </script>
  </body>
</html>
