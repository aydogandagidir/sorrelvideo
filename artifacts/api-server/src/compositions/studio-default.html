<!doctype html>
<html data-aspect="{{layout.aspect}}" style="--vw: {{layout.width}}; --vh: {{layout.height}}">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        /* Canvas is authored per-render from the chosen aspect (server injects
           --vw/--vh). Default 1080×1920 → byte-identical to the legacy portrait. */
        width: calc(var(--vw, 1080) * 1px); height: calc(var(--vh, 1920) * 1px);
        overflow: hidden;
        background: #07070b;
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%; height: 100%; position: relative;
        /* Stacking context so the z-index:-1 .ai-bg-layer renders ABOVE this
           scene's own background (a negative-z child otherwise paints behind the
           parent's opaque background — the AI image would never show). */
        isolation: isolate;
        container-type: size;
        display: flex; flex-direction: column; justify-content: center;
        padding: 130px 96px;
        background:
          radial-gradient(circle at 78% 12%, {{brand.primaryColor}}55, transparent 45%),
          radial-gradient(circle at 15% 88%, {{brand.accentColor}}33, transparent 45%),
          linear-gradient(160deg, #0b0b12 0%, #07070b 60%, {{brand.secondaryColor}} 160%);
      }
      /* AI background image (generative media). Sits at z-index:-1 so it paints
         ABOVE the .scene gradient (the element's own background) but BELOW the
         in-flow content — no content z-index edits needed. A readability scrim
         darkens it for light overlay text. When ai.backgroundImage is unset the
         server substitutes src="" and the whole layer collapses, so a no-AI
         render is byte-identical to the authored gradient. */
      .ai-bg-layer { position: absolute; inset: 0; z-index: -1; }
      .ai-bg-layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .ai-bg-layer::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(7, 7, 11, 0.5), rgba(7, 7, 11, 0.72));
      }
      .ai-bg-layer:has(img[src=""]) { display: none; }
      .glow {
        position: absolute; width: 760px; height: 760px; border-radius: 50%;
        background: radial-gradient(circle, {{brand.primaryColor}}40, transparent 70%);
        top: -200px; right: -220px; filter: blur(40px);
      }
      .brand { display: flex; align-items: center; gap: 26px; margin-bottom: 90px; }
      .brand-logo {
        width: 110px; height: 110px; border-radius: 28px;
        background: linear-gradient(135deg, {{brand.primaryColor}}, {{brand.accentColor}});
        display: flex; align-items: center; justify-content: center;
        font-size: 56px; font-weight: 800; color: #fff;
        box-shadow: 0 20px 60px {{brand.primaryColor}}66;
      }
      .brand-name { font-size: 38px; font-weight: 700; letter-spacing: 0.5px; }
      .headline {
        font-size: 118px; font-weight: 900; line-height: 1.02; letter-spacing: -3px;
        background: linear-gradient(120deg, #ffffff 30%, {{brand.accentColor}});
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      .body {
        font-size: 44px; line-height: 1.45; margin-top: 56px; max-width: 820px;
        color: rgba(255, 255, 255, 0.82);
      }
      .cta {
        display: inline-flex; align-items: center; gap: 18px; margin-top: 110px;
        padding: 36px 64px; width: fit-content;
        background: linear-gradient(135deg, {{brand.primaryColor}}, {{brand.accentColor}});
        color: #fff; border-radius: 999px; font-size: 40px; font-weight: 800;
        box-shadow: 0 24px 70px {{brand.primaryColor}}55;
      }
      .progress {
        position: absolute; left: 96px; right: 96px; bottom: 90px; height: 8px;
        border-radius: 8px; background: rgba(255, 255, 255, 0.12); overflow: hidden;
      }
      .progress > span {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, {{brand.primaryColor}}, {{brand.accentColor}});
      }

      /* ── Aspect-responsive reflow ──────────────────────────────────────────
         The headless engine lays out ONCE with no resize, so we switch on the
         server-set data-aspect attribute (not @media). Portrait keeps the
         authored left-aligned column; landscape + square become a centered hero
         so a wide/square frame doesn't read as a lonely portrait column. */
      [data-aspect="landscape"] .scene,
      [data-aspect="square"] .scene {
        align-items: center; text-align: center;
      }
      [data-aspect="landscape"] .scene { padding: 96px 220px; }
      [data-aspect="square"] .scene { padding: 110px 120px; }
      [data-aspect="landscape"] .brand,
      [data-aspect="square"] .brand { justify-content: center; margin-bottom: 56px; }
      [data-aspect="landscape"] .body,
      [data-aspect="square"] .body { margin-left: auto; margin-right: auto; }
      [data-aspect="landscape"] .headline { font-size: 104px; }
      [data-aspect="square"] .headline { font-size: 100px; }
      [data-aspect="landscape"] .body { margin-top: 44px; }
      [data-aspect="landscape"] .cta,
      [data-aspect="square"] .cta { margin-top: 72px; }
      [data-aspect="landscape"] .glow,
      [data-aspect="square"] .glow {
        top: -28%; right: 50%; transform: translateX(50%);
      }

      /* Elements are visible by DEFAULT (opacity:1) so the clip is never blank
         even if the host never calls seek. seek(t) layers an intro animation
         on top — we never paint a t=0 hidden state at load. */
      .anim { will-change: opacity, transform; }
    </style>
  </head>
  <body>
    <div
      class="scene"
      data-composition-id="studio"
      data-width="{{layout.width}}"
      data-height="{{layout.height}}"
      data-duration="5"
    >
      <div class="ai-bg-layer">
        <img
          class="ai-bg"
          src="{{ai.backgroundImage}}"
          alt=""
          onerror="this.parentElement.style.display='none'"
        />
      </div>
      <div class="glow"></div>
      <div class="brand anim" data-from="0.1" data-to="0.8" data-slide="-36">
        <div class="brand-logo">{{brand.initial}}</div>
        <div class="brand-name">{{brand.companyName}}</div>
      </div>
      <h1 class="headline anim" data-from="0.35" data-to="1.3" data-slide="46">
        {{user.headline}}
      </h1>
      <p class="body anim" data-from="0.8" data-to="1.7" data-slide="34">
        {{user.bodyText}}
      </p>
      <div class="cta anim" data-from="1.2" data-to="2.0" data-slide="26">
        {{user.ctaText}} &rarr;
      </div>
      <div class="progress"><span id="pbar"></span></div>
    </div>

    <script>
      (function () {
        var DURATION = 5;
        var items = Array.prototype.slice
          .call(document.querySelectorAll(".anim"))
          .map(function (el) {
            return {
              el: el,
              from: parseFloat(el.getAttribute("data-from")) || 0,
              to: parseFloat(el.getAttribute("data-to")) || DURATION,
              slide: parseFloat(el.getAttribute("data-slide")) || 0,
            };
          });
        var pbar = document.getElementById("pbar");
        function clamp01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function render(t) {
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            var span = it.to - it.from;
            var raw = span > 0 ? (t - it.from) / span : t >= it.from ? 1 : 0;
            var p = easeOut(clamp01(raw));
            it.el.style.opacity = String(p);
            it.el.style.transform = "translateY(" + (1 - p) * it.slide + "px)";
          }
          if (pbar) pbar.style.width = clamp01(t / DURATION) * 100 + "%";
        }
        // NOTE: do NOT call render(0) at load — that would hide everything if
        // seek is never invoked. CSS default keeps the frame full; the first
        // real seek(0) starts the intro.
        window.__hf = {
          duration: DURATION,
          seek: function (t) {
            render(Math.max(0, Math.min(DURATION, Number(t) || 0)));
          },
        };
      })();
    </script>
  </body>
</html>
