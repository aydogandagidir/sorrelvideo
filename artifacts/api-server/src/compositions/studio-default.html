<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: {{brand.fontFamily}}, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          {{brand.primaryColor}}cc 0%,
          #0a0a0a 50%,
          {{brand.secondaryColor}}99 100%
        );
        position: relative;
        padding: 120px;
      }
      .glow {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          {{brand.accentColor}}55,
          transparent 70%
        );
        bottom: -200px;
        left: -200px;
        filter: blur(20px);
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 1400px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 64px;
        animation: fadeIn 0.5s ease 0.2s forwards;
        opacity: 0;
      }
      .brand-logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: {{brand.primaryColor}};
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 800;
      }
      .brand-name {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .headline {
        font-size: 132px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(
          135deg,
          #fff,
          {{brand.accentColor}}
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: slideUp 0.7s ease 0.5s forwards;
        opacity: 0;
      }
      .body {
        font-size: 38px;
        line-height: 1.45;
        margin-top: 40px;
        max-width: 1100px;
        color: rgba(255, 255, 255, 0.78);
        animation: fadeIn 0.5s ease 0.9s forwards;
        opacity: 0;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        margin-top: 80px;
        padding: 28px 56px;
        background: {{brand.accentColor}};
        color: #0a0a0a;
        border-radius: 999px;
        font-size: 32px;
        font-weight: 700;
        animation: fadeIn 0.5s ease 1.2s forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="glow"></div>
      <div class="card">
        <div class="brand">
          <div class="brand-logo">{{brand.initial}}</div>
          <div class="brand-name">{{brand.companyName}}</div>
        </div>
        <h1 class="headline">{{user.headline}}</h1>
        <p class="body">{{user.bodyText}}</p>
        <div class="cta">{{user.ctaText}} →</div>
      </div>
    </div>
  </body>
</html>
