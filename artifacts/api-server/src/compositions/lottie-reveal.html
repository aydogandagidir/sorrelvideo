<!--
  lottie-reveal — hand-authored Sorrel composition (Track B, M-features).
  Demonstrates the Hyperframes Lottie pipeline: a lottie-web animation (a
  stroked ring that scales in and rotates) plays as an animated accent behind a
  brand headline reveal.

  Determinism: the Lottie player is created with autoplay:false and is stepped
  with goToAndStop(frame) from a single PAUSED GSAP timeline (window.__timelines),
  so the BeginFrame engine drives Lottie by seek — never wall-clock — and frames
  are byte-identical. The animation DATA is INLINE (no network fetch), so the
  render is self-contained. lottie-web loads from CDN like GSAP/D3/Three.

  Robustness: brand colour + the headline/CTA reveal are plain GSAP/CSS, so even
  if the Lottie data ever fails to mount the composition is never blank.

  NOTE: verify the Lottie animation visually with a draft render before relying
  on it in the gallery (the inline bodymovin JSON cannot be type-checked).
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Lottie Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07070b;
      }
    </style>
  </head>
  <body>
    <div
      id="lottie-reveal"
      data-composition-id="lottie-reveal"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="6"
    >
      <div class="stage">
        <div class="halo"></div>
        <div id="lottie-mount" class="lottie"></div>
        <div class="copy">
          <div class="eyebrow">{{brand.companyName}}</div>
          <h1 class="headline">{{user.headline}}</h1>
          <div class="cta">{{user.ctaText}}</div>
        </div>
      </div>

      <style>
        [data-composition-id="lottie-reveal"] .stage {
          position: relative;
          width: 1080px;
          height: 1920px;
          background: radial-gradient(120% 90% at 50% 36%, #14141d 0%, #07070b 64%);
          font-family: "Inter", sans-serif;
          overflow: hidden;
        }
        [data-composition-id="lottie-reveal"] .halo {
          position: absolute;
          left: 50%;
          top: 640px;
          width: 720px;
          height: 720px;
          transform: translate(-50%, -50%) scale(0.6);
          border-radius: 50%;
          background: radial-gradient(
            circle,
            color-mix(in srgb, {{brand.primaryColor}} 45%, transparent) 0%,
            rgba(7, 7, 11, 0) 68%
          );
          opacity: 0;
          z-index: 1;
        }
        [data-composition-id="lottie-reveal"] .lottie {
          position: absolute;
          left: 50%;
          top: 640px;
          width: 620px;
          height: 620px;
          transform: translate(-50%, -50%);
          z-index: 2;
        }
        [data-composition-id="lottie-reveal"] .copy {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 300px;
          z-index: 3;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 0 90px;
        }
        [data-composition-id="lottie-reveal"] .eyebrow {
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.28em;
          text-transform: uppercase;
          color: {{brand.accentColor}};
          opacity: 0;
          margin-bottom: 24px;
        }
        [data-composition-id="lottie-reveal"] .headline {
          font-family: "Space Grotesk", sans-serif;
          font-size: 80px;
          line-height: 1.03;
          font-weight: 700;
          color: #fff;
          opacity: 0;
          max-width: 880px;
        }
        [data-composition-id="lottie-reveal"] .cta {
          margin-top: 38px;
          font-size: 30px;
          font-weight: 600;
          color: #0a0a0f;
          background: {{brand.primaryColor}};
          padding: 18px 40px;
          border-radius: 9999px;
          opacity: 0;
        }
      </style>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="lottie-reveal"]');

          // Minimal, self-contained bodymovin animation: a stroked ring that
          // scales in (frames 0–30) and rotates a full turn (frames 0–90).
          const RING = {
            v: "5.7.4",
            fr: 30,
            ip: 0,
            op: 90,
            w: 400,
            h: 400,
            nm: "ring",
            ddd: 0,
            assets: [],
            layers: [
              {
                ddd: 0,
                ind: 1,
                ty: 4,
                nm: "ring",
                sr: 1,
                ks: {
                  o: { a: 0, k: 100 },
                  r: {
                    a: 1,
                    k: [
                      { t: 0, s: [0], i: { x: [0.4], y: [1] }, o: { x: [0.6], y: [0] } },
                      { t: 90, s: [360] },
                    ],
                  },
                  p: { a: 0, k: [200, 200, 0] },
                  a: { a: 0, k: [0, 0, 0] },
                  s: {
                    a: 1,
                    k: [
                      { t: 0, s: [0, 0, 100], i: { x: [0.3], y: [1] }, o: { x: [0.7], y: [0] } },
                      { t: 30, s: [100, 100, 100] },
                    ],
                  },
                },
                ao: 0,
                shapes: [
                  {
                    ty: "gr",
                    it: [
                      { ty: "el", p: { a: 0, k: [0, 0] }, s: { a: 0, k: [240, 240] } },
                      {
                        ty: "st",
                        c: { a: 0, k: [1, 1, 1, 1] },
                        o: { a: 0, k: 90 },
                        w: { a: 0, k: 14 },
                        lc: 2,
                        lj: 1,
                        d: [
                          { n: "d", nm: "dash", v: { a: 0, k: 2 } },
                          { n: "g", nm: "gap", v: { a: 0, k: 40 } },
                        ],
                      },
                      {
                        ty: "tr",
                        p: { a: 0, k: [0, 0] },
                        a: { a: 0, k: [0, 0] },
                        s: { a: 0, k: [100, 100] },
                        r: { a: 0, k: 0 },
                        o: { a: 0, k: 100 },
                      },
                    ],
                  },
                ],
                ip: 0,
                op: 90,
                st: 0,
                bm: 0,
              },
            ],
          };

          let anim = null;
          let totalFrames = 90;
          try {
            anim = window.lottie.loadAnimation({
              container: root.querySelector("#lottie-mount"),
              renderer: "svg",
              loop: false,
              autoplay: false,
              animationData: RING,
            });
            totalFrames = anim.getDuration(true) || 90;
            anim.goToAndStop(0, true);
          } catch (e) {
            /* Lottie failed → the GSAP/CSS reveal below still carries the frame. */
          }

          const state = { lottie: 0 };
          const tl = gsap.timeline({ paused: true });

          // Step the Lottie player from the timeline (frame-accurate, no rAF).
          tl.to(state, { lottie: 1, duration: 6, ease: "none" }, 0);
          tl.eventCallback("onUpdate", function () {
            if (anim) anim.goToAndStop(state.lottie * (totalFrames - 1), true);
          });

          tl.fromTo(
            root.querySelector(".halo"),
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" },
            0.2,
          );
          tl.fromTo(
            root.querySelector(".eyebrow"),
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            1.8,
          );
          tl.fromTo(
            root.querySelector(".headline"),
            { opacity: 0, y: 32 },
            { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" },
            2.2,
          );
          tl.fromTo(
            root.querySelector(".cta"),
            { opacity: 0, y: 20, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" },
            3.0,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["lottie-reveal"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
