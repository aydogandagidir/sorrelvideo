<!--
  video-spotlight — hand-authored Sorrel composition (Track D, video compositing).
  The user's uploaded clip is the HERO: a full-bleed <video> with a branded
  gradient scrim + logo + headline + CTA lower-third animating over it. Mirrors
  the website-showcase pattern (user media + branded frame), so the result is
  always predictable instead of a generic layer that hides or is hidden.

  The video src is the FIXED sibling filename `spotlight-video.mp4`, which
  renderService downloads (from the project's `capture.videoObject`) into the
  render dir before rendering — the engine then composites it (verified on 0.6.6:
  videoCount=1, normal capture path). When no clip is attached (gallery preview /
  no upload) the <video> simply shows nothing over the dark brand stage, so the
  composition still renders a clean branded frame.

  Brand/user placeholders are substituted by renderService.renderCompositionTemplate.
-->
<!doctype html>
<html lang="en" data-aspect="{{layout.aspect}}" style="--vw: {{layout.width}}; --vh: {{layout.height}}">
  <head>
    <meta charset="UTF-8" />
    <title>Video Spotlight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /* Canvas authored per-render from the chosen aspect (server injects
           --vw/--vh via {{layout.*}}). Defaults keep the legacy portrait. */
        width: calc(var(--vw, 1080) * 1px);
        height: calc(var(--vh, 1920) * 1px);
        overflow: hidden;
        background: #05050a;
      }
    </style>
  </head>
  <body>
    <div
      id="video-spotlight"
      data-composition-id="video-spotlight"
      data-width="{{layout.width}}"
      data-height="{{layout.height}}"
      data-start="0"
      data-duration="{{duration}}"
    >
      <div class="stage">
        <!-- HERO: the user's uploaded clip. renderService REPLACES this marker
             with a <video src="spotlight-video.mp4"> ONLY when a clip is present
             (the engine hard-fails if a <video> can't decode its first frame),
             else strips it so the branded stage renders clip-less. -->
        <!--HERO_VIDEO-->

        <!-- Brand scrim so the lower-third copy stays legible over any footage. -->
        <div class="scrim"></div>

        <!-- Top-left brand mark -->
        <img class="brand-logo" src="{{brand.logoUrl}}" alt="" />
        <div class="brand-chip">{{brand.companyName}}</div>

        <!-- Lower-third copy -->
        <div class="copy">
          <h1 class="headline">{{user.headline}}</h1>
          <div class="cta">{{user.ctaText}}</div>
        </div>

        <!-- Accent rule -->
        <div class="rule"></div>
      </div>

      <style>
        [data-composition-id="video-spotlight"] .stage {
          position: relative;
          width: 100%;
          height: 100%;
          background: #05050a;
          font-family: "Inter", sans-serif;
          overflow: hidden;
        }
        [data-composition-id="video-spotlight"] .hero-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: 1;
        }
        [data-composition-id="video-spotlight"] .scrim {
          position: absolute;
          inset: 0;
          z-index: 2;
          background: linear-gradient(
            to bottom,
            rgba(5, 5, 10, 0.55) 0%,
            rgba(5, 5, 10, 0) 28%,
            rgba(5, 5, 10, 0) 52%,
            rgba(5, 5, 10, 0.82) 100%
          );
        }
        [data-composition-id="video-spotlight"] .brand-logo {
          position: absolute;
          left: 72px;
          top: 84px;
          max-width: 240px;
          max-height: 96px;
          object-fit: contain;
          z-index: 3;
          opacity: 0;
        }
        [data-composition-id="video-spotlight"] .brand-logo[src=""] {
          display: none;
        }
        [data-composition-id="video-spotlight"] .brand-chip {
          position: absolute;
          left: 72px;
          top: 96px;
          z-index: 3;
          font-family: "Space Grotesk", sans-serif;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: 0.01em;
          color: #fff;
          opacity: 0;
        }
        /* If a real logo is set, hide the text chip. */
        [data-composition-id="video-spotlight"]
          .brand-logo:not([src=""])
          ~ .brand-chip {
          display: none;
        }
        [data-composition-id="video-spotlight"] .copy {
          position: absolute;
          left: 72px;
          right: 72px;
          bottom: 180px;
          z-index: 3;
        }
        [data-composition-id="video-spotlight"] .headline {
          font-family: "Space Grotesk", sans-serif;
          font-size: 78px;
          line-height: 1.04;
          font-weight: 700;
          color: #fff;
          opacity: 0;
          max-width: 880px;
        }
        [data-composition-id="video-spotlight"] .cta {
          display: inline-block;
          margin-top: 34px;
          font-size: 30px;
          font-weight: 600;
          color: #0a0a0f;
          background: {{brand.primaryColor}};
          padding: 18px 40px;
          border-radius: 9999px;
          opacity: 0;
        }
        [data-composition-id="video-spotlight"] .rule {
          position: absolute;
          left: 72px;
          bottom: 150px;
          width: 0;
          height: 4px;
          border-radius: 2px;
          background: {{brand.primaryColor}};
          z-index: 3;
        }
        /* Aspect re-layout, keyed off the server-set data-aspect (not @media).
           Portrait keeps the authored defaults above. The hero video / scrim are
           edge-anchored (inset: 0) so they fill any canvas already. */
        [data-aspect="landscape"] [data-composition-id="video-spotlight"] .copy {
          left: 110px;
          right: 110px;
          bottom: 110px;
        }
        [data-aspect="landscape"] [data-composition-id="video-spotlight"] .headline {
          font-size: 64px;
          max-width: 1100px;
        }
        [data-aspect="landscape"] [data-composition-id="video-spotlight"] .rule {
          left: 110px;
          bottom: 84px;
        }
        [data-aspect="square"] [data-composition-id="video-spotlight"] .copy {
          bottom: 130px;
        }
        [data-aspect="square"] [data-composition-id="video-spotlight"] .headline {
          font-size: 62px;
        }
        [data-aspect="square"] [data-composition-id="video-spotlight"] .rule {
          bottom: 104px;
        }
      </style>

      <script>
        (function () {
          const root = document.querySelector(
            '[data-composition-id="video-spotlight"]',
          );
          const tl = gsap.timeline({ paused: true });

          tl.to(
            root.querySelector(".brand-logo"),
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            0.3,
          );
          tl.to(
            root.querySelector(".brand-chip"),
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            0.3,
          );
          tl.fromTo(
            root.querySelector(".rule"),
            { width: 0 },
            { width: 120, duration: 0.7, ease: "power3.out" },
            0.6,
          );
          tl.fromTo(
            root.querySelector(".headline"),
            { opacity: 0, y: 36 },
            { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
            0.8,
          );
          tl.fromTo(
            root.querySelector(".cta"),
            { opacity: 0, y: 22, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" },
            1.3,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["video-spotlight"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
