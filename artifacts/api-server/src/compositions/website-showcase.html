<!doctype html>
<html
  lang="en"
  data-aspect="{{layout.aspect}}"
  style="--vw: {{layout.width}}; --vh: {{layout.height}}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website Showcase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        /* Authored per-render from the chosen aspect; default 1920×1080 keeps the
           landscape showcase (what website→video pins) byte-identical. */
        width: calc(var(--vw, 1920) * 1px);
        height: calc(var(--vh, 1080) * 1px);
        overflow: hidden;
        background: #07070b;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="website-showcase"
      data-composition-id="website-showcase"
      data-width="{{layout.width}}"
      data-height="{{layout.height}}"
      data-start="0"
      data-duration="{{duration}}"
    >
      <div class="stage">
        <!-- Browser window mockup containing the captured screenshot -->
        <div class="browser">
          <div class="titlebar">
            <span class="dot red"></span>
            <span class="dot amber"></span>
            <span class="dot green"></span>
            <div class="urlbar">{{capture.url}}</div>
          </div>
          <div class="viewport">
            <img class="shot" src="{{capture.image}}" alt="" />
          </div>
        </div>

        <!-- Branded intro card. The REAL site logo leads when the brand kit has
             one (auto-extracted from the captured site); an empty/broken logo
             collapses via CSS/onerror so the name-only intro is the fallback. -->
        <div class="intro">
          <img
            class="intro-logo"
            src="{{brand.logoUrl}}"
            alt=""
            onerror="this.style.display='none'"
          />
          <div class="intro-kicker">PRESENTING</div>
          <div class="intro-name">{{brand.companyName}}</div>
        </div>

        <!-- Outro CTA -->
        <div class="outro">
          <div class="outro-title">{{capture.title}}</div>
          <div class="outro-pill">{{capture.url}}</div>
        </div>

        <!-- AI-tour lower-third caption (text set at runtime from the decoded
             tour data via textContent ONLY — never HTML-substituted, so an
             AI-authored caption can't inject markup). Empty + hidden otherwise. -->
        <div class="beat-caption"></div>
      </div>

      <style>
        [data-composition-id="website-showcase"] .stage {
          width: 100%;
          height: 100%;
          position: relative;
          overflow: hidden;
          background:
            radial-gradient(
              1200px 700px at 50% -10%,
              {{brand.primaryColor}}22,
              transparent 70%
            ),
            #07070b;
        }

        [data-composition-id="website-showcase"] .browser {
          position: absolute;
          /* Center horizontally for any canvas width. At 1920 this resolves to
             310px (byte-identical to the authored landscape); narrower aspects
             keep the browser centered instead of pinned off to one side. */
          left: calc((100% - 1300px) / 2);
          top: 120px;
          width: 1300px;
          height: 800px;
          background: #15151c;
          border-radius: 16px;
          overflow: hidden;
          box-shadow:
            0 40px 120px rgba(0, 0, 0, 0.6),
            0 0 0 1px rgba(255, 255, 255, 0.06);
          opacity: 0;
          transform: scale(0.92);
        }
        [data-composition-id="website-showcase"] .titlebar {
          height: 52px;
          background: #1d1d26;
          display: flex;
          align-items: center;
          padding: 0 20px;
          gap: 9px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        [data-composition-id="website-showcase"] .dot {
          width: 13px;
          height: 13px;
          border-radius: 50%;
        }
        [data-composition-id="website-showcase"] .dot.red { background: #ff5f57; }
        [data-composition-id="website-showcase"] .dot.amber { background: #febc2e; }
        [data-composition-id="website-showcase"] .dot.green { background: #28c840; }
        [data-composition-id="website-showcase"] .urlbar {
          margin-left: 18px;
          flex: 1;
          height: 30px;
          background: #0e0e14;
          border-radius: 8px;
          color: #8a8a99;
          font-size: 15px;
          display: flex;
          align-items: center;
          padding: 0 16px;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        [data-composition-id="website-showcase"] .viewport {
          position: absolute;
          top: 52px;
          left: 0;
          width: 1300px;
          height: 748px;
          overflow: hidden;
          background: #fff;
        }
        [data-composition-id="website-showcase"] .shot {
          display: block;
          width: 1300px; /* scaled from the 1280px capture viewport */
          height: auto;
          will-change: transform;
        }

        [data-composition-id="website-showcase"] .intro {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background:
            linear-gradient(135deg, {{brand.primaryColor}}, {{brand.secondaryColor}});
        }
        [data-composition-id="website-showcase"] .intro-logo {
          height: 96px;
          max-width: 460px;
          object-fit: contain;
          margin-bottom: 10px;
          filter: drop-shadow(0 10px 34px rgba(0, 0, 0, 0.35));
        }
        [data-composition-id="website-showcase"] .intro-logo[src=""] {
          display: none;
        }
        [data-composition-id="website-showcase"] .intro-kicker {
          color: rgba(255, 255, 255, 0.8);
          font-size: 24px;
          font-weight: 600;
          letter-spacing: 8px;
        }
        [data-composition-id="website-showcase"] .intro-name {
          color: #fff;
          font-size: 96px;
          font-weight: 800;
          letter-spacing: -2px;
          text-align: center;
          max-width: 1600px;
        }

        [data-composition-id="website-showcase"] .outro {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background: rgba(7, 7, 11, 0);
          pointer-events: none;
        }
        [data-composition-id="website-showcase"] .outro-title {
          color: #fff;
          font-size: 64px;
          font-weight: 700;
          text-align: center;
          max-width: 1500px;
          opacity: 0;
          transform: translateY(20px);
        }
        [data-composition-id="website-showcase"] .outro-pill {
          color: #07070b;
          background: #fff;
          font-size: 26px;
          font-weight: 600;
          padding: 14px 32px;
          border-radius: 100px;
          opacity: 0;
          transform: translateY(20px);
        }

        /* AI-tour caption: a branded lower-third just below the browser window.
           Centered via gsap xPercent (NOT a CSS transform) so the entrance y/opacity
           tween doesn't fight the centering. */
        [data-composition-id="website-showcase"] .beat-caption {
          position: absolute;
          left: 50%;
          top: 952px;
          max-width: 1180px;
          padding: 14px 36px;
          border-radius: 100px;
          background:
            linear-gradient(135deg, {{brand.primaryColor}}, {{brand.secondaryColor}});
          color: #fff;
          font-size: 34px;
          font-weight: 700;
          letter-spacing: -0.5px;
          text-align: center;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <script>
        (function () {
          const root = '[data-composition-id="website-showcase"]';
          const shot = root + " .shot";
          const captionEl = document.querySelector(root + " .beat-caption");
          const captureHeight = parseInt("{{capture.height}}", 10) || 800;
          const clamp01 = (v) => Math.min(1, Math.max(0, v));
          const viewportW = 1300;
          const viewportH = 748;

          // User-chosen total duration (seconds). Substituted server-side as a
          // clamped number, so it is always a safe numeric literal.
          const total = parseFloat("{{duration}}") || 9;
          const INTRO_END = 3.3; // intro hold + wipe + browser reveal complete
          const OUTRO_LEN = 1.3; // outro animations occupy the final stretch

          // Optional AI "tour": base64 JSON of ordered beats
          // [{cropX,cropY,cropW,cropH,seconds,caption}] — when present the page is
          // shown as a CURATED pan/zoom highlight reel of the chosen sections
          // instead of a single full-page scroll (the core "no blank, user-
          // directed" redesign). Decoded defensively: an unsubstituted "{{…}}"
          // literal, an empty value, or bad JSON all fall back to scroll mode.
          let tour = null;
          try {
            const raw = "{{capture.tour}}";
            if (raw && raw.charAt(0) !== "{") {
              // atob() yields a Latin-1 binary string, so decode the bytes as
              // UTF-8 — otherwise non-ASCII captions (e.g. Turkish "İletişim")
              // come out mojibake.
              const bin = atob(raw);
              const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
              tour = JSON.parse(new TextDecoder().decode(bytes));
            }
          } catch (e) {
            tour = null;
          }
          if (!Array.isArray(tour) || !tour.length) tour = null;

          // Map a beat's crop (0–1 fractions) to the shot's {width,x,y}: zoom so
          // the crop WIDTH fills the viewport, then pan to its top-left (clamped to
          // the image bounds so a beat never reveals past an edge).
          function cropToShot(b) {
            const cw = Math.min(1, Math.max(0.05, parseFloat(b.cropW) || 1));
            const cx = clamp01(parseFloat(b.cropX) || 0);
            const cy = clamp01(parseFloat(b.cropY) || 0);
            const dispW = viewportW / cw;
            const dispH = captureHeight * (dispW / 1280);
            const x = -Math.min(Math.max(0, dispW - viewportW), cx * dispW);
            const y = -Math.min(Math.max(0, dispH - viewportH), cy * dispH);
            return { width: dispW, x: x, y: y };
          }

          const tl = gsap.timeline({ paused: true });

          // 1. Intro card holds, then wipes up to reveal the browser (shared).
          tl.to(root + " .intro", { duration: 0.6, ease: "power3.inOut" }, 0); // hold
          tl.to(
            root + " .intro",
            { yPercent: -100, duration: 0.8, ease: "power4.inOut" },
            1.8,
          );
          tl.to(
            root + " .browser",
            { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
            2.2,
          );

          let outroBase;
          if (tour) {
            // 2a. AI-directed TOUR: pan/zoom to each chosen section, hold, caption.
            const TRANS = 0.9; // pan/zoom transition between beats
            if (captionEl) gsap.set(captionEl, { xPercent: -50 });
            gsap.set(shot, cropToShot(tour[0]));
            let t = INTRO_END;
            for (let i = 0; i < tour.length; i++) {
              const b = tour[i];
              const hold = Math.min(8, Math.max(1, parseFloat(b.seconds) || 2.5));
              if (i > 0) {
                tl.to(
                  shot,
                  Object.assign(
                    { duration: TRANS, ease: "power2.inOut" },
                    cropToShot(b),
                  ),
                  t,
                );
                t += TRANS;
              }
              const cap = (b.caption == null ? "" : String(b.caption)).slice(0, 80);
              if (cap && captionEl) {
                tl.call(
                  () => {
                    captionEl.textContent = cap;
                  },
                  [],
                  t,
                );
                tl.fromTo(
                  root + " .beat-caption",
                  { opacity: 0, y: 16 },
                  { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
                  t + 0.1,
                );
                tl.to(
                  root + " .beat-caption",
                  { opacity: 0, duration: 0.3, ease: "power2.in" },
                  t + hold - 0.3,
                );
              }
              t += hold;
            }
            outroBase = t;
          } else {
            // 2b. Single-crop full-page scroll (backward-compatible default; a
            //     0/0/1/1 crop reproduces the original whole-page scroll exactly).
            const cropX = clamp01(parseFloat("{{capture.cropX}}") || 0);
            const cropY = clamp01(parseFloat("{{capture.cropY}}") || 0);
            const cropW = Math.min(1, Math.max(0.05, parseFloat("{{capture.cropW}}") || 1));
            const cropH = Math.min(1, Math.max(0.05, parseFloat("{{capture.cropH}}") || 1));
            const dispW = viewportW / cropW;
            const dispH = captureHeight * (dispW / 1280);
            const cropLeft = cropX * dispW;
            const cropTop = cropY * dispH;
            const cropRegionH = cropH * dispH;
            const scrollStart = cropTop;
            const scroll = Math.max(
              scrollStart,
              Math.min(dispH - viewportH, cropTop + cropRegionH - viewportH),
            );
            gsap.set(shot, { width: dispW, x: -cropLeft });
            const scrollDuration = Math.max(0.3, total - INTRO_END - OUTRO_LEN);
            tl.fromTo(
              shot,
              { y: -scrollStart },
              { y: -scroll, duration: scrollDuration, ease: "none" },
              INTRO_END,
            );
            outroBase = INTRO_END + scrollDuration; // = total - OUTRO_LEN
          }

          // 3. Outro: darken + title/URL fade up, anchored to the final seconds (shared).
          tl.to(
            root + " .outro",
            { background: "rgba(7,7,11,0.82)", duration: 0.7, ease: "power2.out" },
            outroBase,
          );
          tl.to(
            root + " .outro-title",
            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
            outroBase + 0.2,
          );
          tl.to(
            root + " .outro-pill",
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            outroBase + 0.5,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["website-showcase"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
